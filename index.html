import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0xa8def4);

scene.fog =
    new THREE.Fog(
        0xa8def4,
        1000,
        3200
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        50,
        innerWidth/innerHeight,
        0.1,
        4000
    );

camera.position.set(
    1250,
    850,
    1300
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.35;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping=true;
controls.dampingFactor=.06;

controls.minDistance=120;
controls.maxDistance=2800;

controls.target.set(
    0,
    80,
    0
);


/* =========================================================
   LIGHTS
========================================================= */

        0x3c7044,
        4

);

sun.shadow.mapSize.height=2048;

========================================================= */

function mat(
    color,
    rough=.7,
    metal=0
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness:rough,
        metalness:metal

}

/* =========================================================
   ROADS
========================================================= */

function road(
    x,
    z,
    w,
    d
){

    const r=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                .5,
                d
            ),
            roadMat
        );

    r.position.set(
        x,
        5,
        z
    );

    r.receiveShadow=true;

    scene.add(r);


    if(w>d){

        const line=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    w,
                    .08,
                    .7
                ),
                mat(0xf4c542,.6)
            );

        line.position.set(
            x,
            5.3,
            z
        );

        scene.add(line);

    }else{

        const line=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .7,
                    .08,
                    d
                ),
                mat(0xf4c542,.6)
            );

        line.position.set(
            x,
            5.3,
            z
        );

        scene.add(line);
    }
}

/* =========================================================
   LABEL
========================================================= */

function label(
    text,
    x,
    y,
    z
){

    const canvas=
        document.createElement("canvas");

    canvas.width=1000;
    canvas.height=220;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle="#063b50";
    ctx.fillRect(0,0,1000,220);

    ctx.strokeStyle="#6beaff";
    ctx.lineWidth=8;

    ctx.strokeRect(
        5,5,990,210
    );

    ctx.fillStyle="#ffffff";
    ctx.font="bold 75px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        text,
        500,
        110
    );

    const texture=
        new THREE.CanvasTexture(canvas);

    texture.colorSpace=
        THREE.SRGBColorSpace;

    const mesh=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                90,
                20
            ),
            new THREE.MeshBasicMaterial({
                map:texture,
                transparent:true
            })
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.rotation.x=-Math.PI/2;

    scene.add(mesh);
}

/* =========================================================
   SIMPLE SMART BUILDING
========================================================= */

function building(
    name,
    x,
    z,
    h,
    w,
    d,
    color
){

    const group=
        new THREE.Group();

    group.position.set(
        x,
        5,
        z
    );


    /* foundation */

    const base=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w+18,
                3,
                d+18
            ),
            dark
        );

    base.position.y=1.5;

    group.add(base);


    /* main body */

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            mat(color,.2,.7)
        );

    body.position.y=h/2;

    body.castShadow=true;

    group.add(body);


    /* glass center */

    const glass=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w*.22,
                h+2,
                d+.8
            ),
            new THREE.MeshStandardMaterial({
                color:0x8eeaff,
                emissive:0x087d9d,
                emissiveIntensity:.8,
                transparent:true,
                opacity:.72,
                roughness:.08,
                metalness:.5
            })
        );

    glass.position.y=h/2;

    group.add(glass);


    /* vertical fins */

    for(const side of [-1,1]){

        const fin=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    4,
                    h+4,
                    6
                ),
                new THREE.MeshStandardMaterial({
                    color:0x55e8ff,
                    emissive:0x00cfff,
                    emissiveIntensity:.5,
                    metalness:.7
                })
            );

        fin.position.set(
            side*w*.43,
            h/2,
            0
        );

        group.add(fin);
    }


    /* floor bands */

    for(
        let y=12;
        y<h;
        y+=12
    ){

        const band=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    w+4,
                    .5,
                    d+4
                ),
                new THREE.MeshStandardMaterial({
                    color:0x48dfff,
                    emissive:0x10cfff,
                    emissiveIntensity:.18,
                    metalness:.7
                })
            );

        band.position.y=y;

        group.add(band);
    }


    /* front windows */

    const windowMat=
        new THREE.MeshStandardMaterial({
            color:0xbef5ff,
            emissive:0x35dcff,
            emissiveIntensity:1.2,
            roughness:.08
        });


    for(
        let y=10;
        y<h-8;
        y+=12
    ){

        for(
            let xx=-w*.3;
            xx<=w*.3;
            xx+=10
        ){

            const win=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        6,
                        5,
                        .3
                    ),
                    windowMat
                );

            win.position.set(
                xx,
                y,
                d/2+.3
            );

            group.add(win);
        }
    }


    /* pointed Dubai crown */

    const crown=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                w*.55,
                h*.18,
                4
            ),
            mat(color,.18,.75)
        );

    crown.position.y=
        h+h*.09;

    crown.rotation.y=
        Math.PI/4;

    group.add(crown);


    /* tower spire */

    const spire=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .7,
                1.3,
                35,
                12
            ),
            cyan
        );

    spire.position.y=
        h+h*.18+17;

    group.add(spire);


    /* energy receiver */

    const receiver=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                3.5,
                18,
                18
            ),
            new THREE.MeshStandardMaterial({
                color:0xb8faff,
                emissive:0x00dfff,
                emissiveIntensity:5
            })
        );

    receiver.position.y=
        h+h*.18+35;

    group.add(receiver);


    scene.add(group);


    clickableObject(
        group,
        name,
        "A tall Dubai-style smart building connected to the city's centralized renewable-energy transmission system."
    );

    return group;
}

/* =========================================================
   CAR POSITION
========================================================= */

function routePosition(
    routeIndex,
    progress
){

    const points=
        routes[routeIndex];

    const scaled=
        progress*points.length;

    const index=
        Math.floor(scaled)%
        points.length;

    const next=
        (index+1)%
        points.length;

    const t=
        scaled-
        Math.floor(scaled);

    const a=points[index];
    const b=points[next];

    return {
        x:
            a[0]+
            (b[0]-a[0])*t,

        z:
            a[1]+
            (b[1]-a[1])*t,

        dx:b[0]-a[0],
        dz:b[1]-a[1]
    };
}


/* =========================================================
   RAYCAST
========================================================= */

const raycaster=
    new THREE.Raycaster();

const mouse=
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "click",
    event=>{

        mouse.x=
            event.clientX/
            innerWidth*
            2-1;

        mouse.y=
            -(event.clientY/
            innerHeight)*
            2+1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        for(const item of clickable){

            const hits=
                raycaster.intersectObject(
                    item.object,
                    true
                );

            if(hits.length){

                document.getElementById(
                    "infoTitle"
                ).textContent=
                    item.title;

                document.getElementById(
                    "infoText"
                ).textContent=
                    item.text;

                document.getElementById(
                    "info"
                ).style.display="block";

                return;
            }
        }
    }
);


document.getElementById(
    "close"
).onclick=()=>{

    document.getElementById(
        "info"
    ).style.display="none";
};


/* =========================================================
   ANIMATION
========================================================= */

const clock=
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const elapsed=
        clock.getElapsedTime();


    /* rings */

    rings.forEach(
        (ring,i)=>{

            ring.rotation.z=
                elapsed*
                (i?-.8:.6);
        }
    );


    /* core */

    core.scale.setScalar(
        1+
        Math.sin(elapsed*4)*.12
    );


    /* solar units */

    solarUnits.forEach(
        (unit,i)=>{

            unit.rotation.z=
                Math.sin(
                    elapsed*.3+i
                )*.008;
        }
    );


    /* turbines */

    turbineBlades.forEach(
        hub=>{

            hub.rotation.z=
                elapsed*2;
        }
    );


    /* electricity */

    powerDots.forEach(
        dot=>{

            const curve=
                powerLines[
                    dot.line
                ];

            const t=
                (
                    elapsed*.08+
                    dot.offset
                )%1;

            dot.mesh.position.copy(
                curve.getPointAt(t)
            );
        }
    );


    /* cars */

    cars.forEach(
        car=>{

            car.progress+=
                car.speed/
                40;

            if(car.progress>=1)
                car.progress-=1;

            const p=
                routePosition(
                    car.route,
                    car.progress
                );

            car.object.position.set(
                p.x,
                5.5,
                p.z
            );

            car.object.rotation.y=
                -Math.atan2(
                    p.dz,
                    p.dx
                );
        }
    );


    controls.update();

    renderer.render(
        scene,
        camera
    );
}


animate();
