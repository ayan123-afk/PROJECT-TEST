  antialias:true,
  powerPreference:"high-performance"
});

  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

/* =========================================================
   CAMERA
========================================================= */

const controls=new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.06;

controls.maxDistance=420;

   LIGHTING
========================================================= */

  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness

}

const grassDark=mat(0x244a2c);
const roadMat=mat(0x202830,.95);
const concreteMat=mat(0x778187);

  .15

========================================================= */

const ground=new THREE.Mesh(

/* =========================================================
   ROADS
========================================================= */

function createRoad(x,z,w,d){

  const road=new THREE.Mesh(
    new THREE.BoxGeometry(w,.35,d),
    roadMat
  );

  road.position.set(x,1,z);
  road.receiveShadow=true;

  scene.add(road);

  if(w>d){

    for(
      let i=-w/2+8;
      i<w/2;
      i+=12
    ){

      const mark=new THREE.Mesh(
        new THREE.BoxGeometry(6,.06,.35),
        whiteMat
      );

      mark.position.set(
        x+i,
        1.2,
        z
      );

      scene.add(mark);
    }

  }else{

    for(
      let i=-d/2+8;
      i<d/2;
      i+=12
    ){

      const mark=new THREE.Mesh(
        new THREE.BoxGeometry(.35,.06,6),
        whiteMat
      );

      mark.position.set(
        x,
        1.2,
        z+i
      );

      scene.add(mark);
    }

  }
}

/* =========================================================
   TEXT SPRITE
========================================================= */

function addTextSprite(
  text,
  pos,
  scaleX=32,
  scaleY=5.6
){

  const canvas=document.createElement("canvas");

  canvas.width=1024;
  canvas.height=180;

  const ctx=canvas.getContext("2d");

  ctx.clearRect(0,0,1024,180);

  ctx.fillStyle="#ffffff";

  ctx.font="bold 70px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    text,
    512,
    90
  );

  const texture=new THREE.CanvasTexture(canvas);

  texture.colorSpace=THREE.SRGBColorSpace;

  const material=new THREE.SpriteMaterial({
    map:texture,
    transparent:true,
    depthTest:false
  });

  const sprite=new THREE.Sprite(material);

  sprite.position.copy(pos);

  sprite.scale.set(
    scaleX,
    scaleY,
    1
  );

  scene.add(sprite);

  return sprite;
}

/* =========================================================
   3D INFORMATION BOARDS
========================================================= */

const boards=[];

function createBoard(
  title,
  x,
  z,
  width=18,
  color=0x126a94
){

  const group=new THREE.Group();

  group.position.set(x,0,z);

  /* posts */

  const postMat=mat(0x3d474c);

  const post1=new THREE.Mesh(
    new THREE.CylinderGeometry(.22,.28,5,8),
    postMat
  );

  post1.position.set(
    -width/2+1,
    2.5,
    0
  );

  group.add(post1);

  const post2=post1.clone();

  post2.position.x=
    width/2-1;

  group.add(post2);

  /* board */

  const board=new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      4.5,
      .45
    ),
    mat(color,.5,.15)
  );

  board.position.y=5;

  board.castShadow=true;

  group.add(board);

  /* board top */

  const top=new THREE.Mesh(
    new THREE.BoxGeometry(
      width+.5,
      .35,
      .7
    ),
    whiteMat
  );

  top.position.y=7.35;

  group.add(top);

  scene.add(group);

  addTextSprite(
    title,
    new THREE.Vector3(
      x,
      5,
      z-.5
    ),
    width*1.25,
    4.5
  );

  boards.push(group);

  return group;
}

/* =========================================================
   FLOWERS
========================================================= */

const flowers=[];

function createFlower(
  x,
  z,
  scale=.7
){

  const group=new THREE.Group();

  group.position.set(
    x,
    1.3,
    z
  );

  group.scale.setScalar(scale);

  const stem=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .06,
      .08,
      1.4,
      6
    ),
    mat(0x2c7a39)
  );

  stem.position.y=.7;

  group.add(stem);

  const flowerMat=mat(
    [0xff5f7e,0xffd84d,0xff8cff,0xffffff][
      Math.floor(Math.random()*4)
    ]
  );

  for(let i=0;i<5;i++){

    const petal=new THREE.Mesh(
      new THREE.SphereGeometry(
        .28,
        8,
        8
      ),
      flowerMat
    );

    const a=(i/5)*Math.PI*2;

    petal.position.set(
      Math.cos(a)*.38,
      1.45,
      Math.sin(a)*.38
    );

    petal.scale.set(
      1,
      .55,
      1
    );

    group.add(petal);
  }

  const center=new THREE.Mesh(
    new THREE.SphereGeometry(
      .2,
      8,
      8
    ),
    mat(0xffd84d)
  );

  center.position.y=1.45;

  group.add(center);

  scene.add(group);

  flowers.push(group);
}

/* =========================================================
   STUDENTS
========================================================= */

const students=[];

function createStudent(x,z){

  const group=new THREE.Group();

  group.position.set(
    x,
    1.5,
    z
  );

  const uniform=mat(0x183f65);
  const skin=mat(0xd69b78);
  const dark=mat(0x20242a);

  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .8,
      1.8,
      4,
      8
    ),
    uniform
  );

  body.position.y=2.3;
  body.castShadow=true;

  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(
      .72,
      12,
      10
    ),
    skin
  );

  head.position.y=4.3;

  group.add(head);

  const hair=new THREE.Mesh(
    new THREE.SphereGeometry(
      .75,
      12,
      8,
      0,
      Math.PI*2,
      0,
      Math.PI/2
    ),
    dark
  );

  hair.position.y=4.65;

  group.add(hair);

  const armL=new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .18,
      1.25,
      4,
      6
    ),
    uniform
  );

  armL.position.set(
    -1,
    2.5,
    0
  );

  group.add(armL);

  const armR=armL.clone();

  armR.position.x=1;

  group.add(armR);

  const legL=new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .22,
      1.35,
      4,
      6
    ),
    dark
  );

  legL.position.set(
    -.4,
    .9,
    0
  );

  group.add(legL);

  const legR=legL.clone();

  legR.position.x=.4;

  group.add(legR);

  scene.add(group);

  students.push({
    group,
    armL,
    armR,
    legL,
    legR,
    baseX:x,
    baseZ:z,
    phase:Math.random()*Math.PI*2,
    radius:8+Math.random()*12,
    speed:.25+Math.random()*.2
  });
}

/* =========================================================
   MODEL PREPARATION
========================================================= */

function prepareModel(
  object,
  targetSize=60
){

  const box=new THREE.Box3()
    .setFromObject(object);

  const size=new THREE.Vector3();
  const center=new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const maxDim=Math.max(
    size.x,
    size.y,
    size.z
  );

  const scale=
    targetSize/
    Math.max(maxDim,.001);

  object.scale.setScalar(scale);

  const newBox=
    new THREE.Box3()
      .setFromObject(object);

  const newCenter=
    new THREE.Vector3();

  newBox.getCenter(newCenter);

  object.position.x-=newCenter.x;
  object.position.z-=newCenter.z;
  object.position.y-=newBox.min.y;

  object.traverse(child=>{

    if(child.isMesh){

      child.castShadow=true;
      child.receiveShadow=true;

    }

  });
}

          );

          hotel.rotation.y=

          );

/* =========================================================

function loadBuildings(){

  loader.load(

    "./buildings.glb",

    gltf=>{

      const template=gltf.scene;

      prepareModel(
        template,
        30
      );

      const positions=[
        [-72,38],
        [25,58],
        [70,42],
        [72,-20],
        [-72,-20],
        [25,-58],
        [-35,58]
      ];

        (pos,index)=>{

          const building=

/* =========================================================
   RAYCASTING
========================================================= */

const raycaster=
  new THREE.Raycaster();

const mouse=
  new THREE.Vector2();

renderer.domElement.addEventListener(
  "click",
  event=>{

    mouse.x=
      (event.clientX/
      window.innerWidth)*2-1;

    mouse.y=
      -(event.clientY/
      window.innerHeight)*2+1;

    raycaster.setFromCamera(
      mouse,
      camera
    );

    for(
      const item of clickable
    ){

      const hits=
        raycaster.intersectObject(
          item.object,
          true
        );

      if(hits.length){

        if(item.type==="school"){
          showSchool();
        }

        if(item.type==="hospital"){
          showHospital();
        }

        return;
      }

    }

  }
);

/* =========================================================
   ANIMATION
========================================================= */

const clock=
  new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  const t=
    clock.getElapsedTime();

  /* STUDENTS */

  students.forEach(s=>{

    const angle=
      s.phase+
      t*s.speed;

    s.group.position.x=
      s.baseX+
      Math.cos(angle)*
      s.radius;

    s.group.position.z=
      s.baseZ+
      Math.sin(angle)*
      s.radius*.65;

    s.group.rotation.y=
      -Math.sin(angle);

    const walk=
      Math.sin(
        t*8+
        s.phase
      );

    s.legL.rotation.x=
      walk*.55;

    s.legR.rotation.x=
      -walk*.55;

    s.armL.rotation.x=
      -walk*.4;

    s.armR.rotation.x=
      walk*.4;

    s.group.position.y=
      1.5+
      Math.abs(
        Math.sin(
          t*8+
          s.phase
        )
      )*.12;

  });

  /* CARS */

  cars.forEach(c=>{

    c.car.position.x+=
      c.speed;

    if(
      c.car.position.x>90
    ){

      c.car.position.x=-90;

    }

  });

  /* TREES GENTLE WIND */

  trees.forEach(
    (tree,i)=>{

      tree.rotation.z=
        Math.sin(
          t*.7+i
        )*.018;

      tree.rotation.x=
        Math.cos(
          t*.6+i
        )*.012;

    }
  );

  /* FLOWERS */

  flowers.forEach(
    (flower,i)=>{

      flower.rotation.z=
        Math.sin(
          t*1.2+i
        )*.025;

    }
  );

  /* LIGHTS */

  lamps.forEach(
    (light,i)=>{

      light.intensity=
        Math.max(
          0,
          Math.sin(
            t*1.5+i*.4
          )
        )*.8;

    }
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();
