<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BSS WORLD — 3D Smart City</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{overflow:hidden;background:#a9dcf4;font-family:Arial,Helvetica,sans-serif;color:white;}

#ui{
    position:fixed;top:18px;left:18px;z-index:50;
    padding:19px 25px;border:1px solid rgba(75,220,255,.45);
    border-radius:17px;background:rgba(3,13,22,.90);
    backdrop-filter:blur(16px);box-shadow:0 15px 55px rgba(0,0,0,.3);
}
#ui .title{font-size:28px;font-weight:900;letter-spacing:5px;}
#ui .sub{margin-top:7px;color:#70e4ff;font-size:12px;letter-spacing:1.4px;}

#trafficStatus{
    position:fixed;top:18px;right:18px;z-index:50;width:315px;
    padding:18px;border-radius:17px;background:rgba(3,13,22,.92);
    border:1px solid rgba(70,220,255,.35);backdrop-filter:blur(16px);
}
#trafficStatus .heading{color:#70e4ff;font-size:11px;letter-spacing:2px;margin-bottom:9px;}
#trafficState{font-size:21px;font-weight:900;margin-bottom:13px;}
#trafficInfo{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.infoBox{padding:10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);}
.infoBox span{display:block;color:#91a5ae;font-size:9px;letter-spacing:1px;margin-bottom:4px;}
.infoBox strong{font-size:13px;}

#aiMessage{
    position:fixed;left:50%;top:100px;transform:translateX(-50%);
    z-index:55;padding:12px 24px;border-radius:12px;
    background:rgba(3,14,22,.95);border:1px solid rgba(90,225,255,.4);
    color:#c9f5ff;font-size:12px;opacity:0;transition:.4s;
}
#aiMessage.show{opacity:1;}

#panel{
    position:fixed;right:18px;top:185px;width:380px;display:none;z-index:60;
    padding:25px;border-radius:18px;background:rgba(3,13,22,.97);
    border:1px solid rgba(70,220,255,.4);box-shadow:0 25px 80px rgba(0,0,0,.55);
}
#panel h2{color:#68e2ff;margin-bottom:9px;font-size:23px;}
#panel .type{color:#8097a2;font-size:11px;letter-spacing:1.5px;margin-bottom:16px;}
#panel p{color:#d0dce1;line-height:1.7;font-size:13px;}
.close{position:absolute;right:12px;top:12px;width:32px;height:32px;border:0;
    border-radius:8px;background:#172731;color:white;font-size:19px;cursor:pointer;}

#hint{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    z-index:50;padding:11px 20px;border-radius:12px;
    background:rgba(3,14,22,.90);border:1px solid rgba(255,255,255,.14);
    color:#d2e1e7;font-size:12px;white-space:nowrap;
}

#loading{
    position:fixed;inset:0;z-index:100;
    background:#0a1a24;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .6s;color:#70e4ff;font-size:14px;letter-spacing:3px;
}
#loading.hide{opacity:0;pointer-events:none;}
#loading .bar{
    width:260px;height:3px;background:rgba(112,228,255,.15);
    border-radius:2px;margin-top:20px;overflow:hidden;
}
#loading .fill{
    height:100%;width:0%;background:#70e4ff;
    transition:width .3s;box-shadow:0 0 12px #70e4ff;
}
</style>
</head>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* =========================================================
   LOADING BAR
========================================================= */
const loadFill = document.getElementById("loadFill");
const loadingScreen = document.getElementById("loading");

/* =========================================================
   SCENE
========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9dcf4);
scene.fog = new THREE.Fog(0xa9dcf4, 1200, 3000);

/* =========================================================
   CAMERA
========================================================= */
const camera = new THREE.PerspectiveCamera(
    52, window.innerWidth / window.innerHeight, .1, 4000
);
camera.position.set(850, 620, 950);

/* =========================================================
   RENDERER
========================================================= */
const renderer = new THREE.WebGLRenderer({
    antialias: true, powerPreference: "high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

/* =========================================================
   CONTROLS
========================================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.minDistance = 80;
controls.maxDistance = 2200;
controls.target.set(0, 5, 0);

/* =========================================================
   LIGHTS
========================================================= */
scene.add(new THREE.HemisphereLight(0xf2fbff, 0x73916b, 3.4));

const sun = new THREE.DirectionalLight(0xffffff, 5.2);
sun.position.set(-500, 800, 400);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -1200;
sun.shadow.camera.right = 1200;
sun.shadow.camera.top = 1200;
sun.shadow.camera.bottom = -1200;
scene.add(sun);

/* =========================================================
   MATERIALS
========================================================= */
const mat = (c, r = .8, m = 0) =>
    new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });

const groundMaterial = mat(0x477a4b, .95);
const roadMaterial   = mat(0x22282c, .96);
const roadLineMat    = mat(0xf5f7f7, .65);
const curbMaterial   = mat(0x9aa5a8, .88);
const whiteMaterial  = mat(0xf4f7f8, .65);
const blueMaterial   = mat(0x087fa8, .35, .25);

/* =========================================================
   GROUND + CITY PLATFORM
========================================================= */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3200, 3200), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const city = new THREE.Mesh(new THREE.BoxGeometry(1400, 1, 1100), groundMaterial);
city.position.set(0, .5, 0);
city.receiveShadow = true;
scene.add(city);

/* =========================================================
   ROADS
========================================================= */
function createRoad(x, z, width, depth) {
    const road = new THREE.Mesh(new THREE.BoxGeometry(width, .45, depth), roadMaterial);
    road.position.set(x, 1.25, z);
    road.receiveShadow = true;
    scene.add(road);

    if (width > depth) {
        for (let i = -width/2 + 10; i < width/2; i += 28) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(15, .08, .45), roadLineMat);
            line.position.set(x + i, 1.51, z);
            scene.add(line);
        }
    } else {
        for (let i = -depth/2 + 10; i < depth/2; i += 28) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(.45, .08, 15), roadLineMat);
            line.position.set(x, 1.51, z + i);
            scene.add(line);
        }
    }
}

// Outer ring (bigger)
createRoad(0, -550, 1450, 36);
createRoad(0,  550, 1450, 36);
createRoad(-720, 0, 36, 1120);
createRoad( 720, 0, 36, 1120);

// Internal grid

createRoad(0,    0, 1400, 22);
createRoad(0,  300, 1400, 20);

createRoad( 120, 0, 20, 1100);
createRoad( 520, 0, 20, 1100);

// Society entrance road

function createCurb(x, z, w, d) {

    c.position.set(x, 1.5, z);

createCurb(0, -320, 1400, 1.5);
createCurb(0,  280, 1400, 1.5);

/* =========================================================
   TREES (along big outer ring)
========================================================= */
function createTree(x, z, scale = 1) {
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.scale.setScalar(scale);

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(.4, .6, 5, 8),
        mat(0x5a3a1e, .9)
    );
    trunk.position.y = 2.5;
    trunk.castShadow = true;
    g.add(trunk);

    const f1 = new THREE.Mesh(new THREE.SphereGeometry(3.5, 12, 12), mat(0x2d6e2d, .85));
    f1.position.y = 6.5;
    f1.castShadow = true;
    g.add(f1);

    const f2 = new THREE.Mesh(new THREE.SphereGeometry(2.6, 10, 10), mat(0x3a8a3a, .85));
    f2.position.set(1.2, 8, .8);
    f2.castShadow = true;
    g.add(f2);

    const f3 = new THREE.Mesh(new THREE.SphereGeometry(2.2, 10, 10), mat(0x256025, .85));
    f3.position.set(-1.3, 7.5, -.7);
    f3.castShadow = true;
    g.add(f3);

    scene.add(g);
}

}

/* =========================================================
   BOARDS (bigger city → repositioned)
========================================================= */
function createBoard(text, x, y, z, width = 65, height = 9) {
    const g = new THREE.Group();
    g.position.set(x, y, z);

    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(.5, .7, 15, 12),
        mat(0x303a40, .5, .25)
    );
    pole.position.y = 7.5;
    pole.castShadow = true;
    g.add(pole);

    const spike = new THREE.Mesh(
        new THREE.ConeGeometry(.9, 3.2, 8),
        mat(0x4b5960, .5, .25)
    );
    spike.position.y = 16.6;
    g.add(spike);

    const board = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, .8),
        blueMaterial
    );
    board.position.y = 12;
    board.castShadow = true;
    g.add(board);

    const canvas = document.createElement("canvas");
    canvas.width = 2200;
    canvas.height = 600;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#075c7b";
    ctx.fillRect(0, 0, 2200, 600);
    ctx.strokeStyle = "#78e9ff";
    ctx.lineWidth = 16;
    ctx.strokeRect(12, 12, 2176, 576);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 145px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, 1100, 300);

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;

    const sign = new THREE.Mesh(
        new THREE.PlaneGeometry(width - 1, height - .8),
        new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
    );
    sign.position.set(0, 12, .42);
    g.add(sign);

    scene.add(g);
}

createBoard("BSS SMART HOSPITAL",      140, 0, -200, 110, 13);
createBoard("BSS SMART SOCIETY",      -420, 0,  500, 130, 14);

createBoard("AI TRAFFIC CONTROLLER",   300, 0,  500, 130, 14);
createBoard("WIND ENERGY",            -120, 0,  500, 95, 13);

/* =========================================================
   STREET LIGHTS
========================================================= */
function createStreetLight(x, z) {
    const g = new THREE.Group();
    g.position.set(x, 0, z);

    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.22, .3, 11, 10), mat(0x69757a, .7));
    pole.position.y = 5.5;

/* =========================================================
   TRAFFIC LIGHTS
========================================================= */
const trafficLights = [];

function createTrafficLight(x, z, rotation = 0) {
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.rotation.y = rotation;

    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.2, .25, 9, 8), curbMaterial);

    g.add(pole);

    const box = new THREE.Mesh(new THREE.BoxGeometry(1.7, 5, 1.4), mat(0x15191c, .5));
    box.position.y = 7.5;
    g.add(box);

    const red = new THREE.Mesh(
        new THREE.SphereGeometry(.35, 14, 14),
        new THREE.MeshStandardMaterial({ color: 0xff2222, emissive: 0xff0000, emissiveIntensity: 0 })
    );
    red.position.set(0, 8.8, .75);
    g.add(red);

    const yellow = new THREE.Mesh(
        new THREE.SphereGeometry(.35, 14, 14),
        new THREE.MeshStandardMaterial({ color: 0xffcc22, emissive: 0xffaa00, emissiveIntensity: 0 })
    );
    yellow.position.set(0, 7.4, .75);
    g.add(yellow);

    const green = new THREE.Mesh(
        new THREE.SphereGeometry(.35, 14, 14),
        new THREE.MeshStandardMaterial({ color: 0x22ff66, emissive: 0x00ff44, emissiveIntensity: 1 })
    );
    green.position.set(0, 6, .75);
    g.add(green);

    scene.add(g);
    trafficLights.push({ red, yellow, green, phase: Math.random() * 10 });
}

/* =========================================================
   WIND TURBINES
========================================================= */
const turbines = [];

function createTurbine(x, z, scale = 1) {
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.scale.setScalar(scale);

    const tower = new THREE.Mesh(new THREE.CylinderGeometry(.9, 1.4, 50, 14), whiteMaterial);
    tower.position.y = 25;
    tower.castShadow = true;
    g.add(tower);

    const hub = new THREE.Group();
    hub.position.set(0, 50, 0);

    const center = new THREE.Mesh(new THREE.SphereGeometry(2.8, 18, 18), whiteMaterial);
    hub.add(center);

    for (let i = 0; i < 3; i++) {
        const blade = new THREE.Mesh(new THREE.BoxGeometry(1.3, 20, .5), whiteMaterial);
        blade.position.y = 10;
        blade.rotation.z = i * Math.PI * 2 / 3;
        blade.geometry.translate(0, 9, 0);
        hub.add(blade);
    }

    g.add(hub);
    scene.add(g);
    turbines.push(hub);
}

createTurbine( -20, 430, 1.1);

/* =========================================================
   CARS
========================================================= */
const cars = [];

function createCar(x, z, speed, direction = 1) {
    const car = new THREE.Group();

    const body = new THREE.Mesh(new THREE.BoxGeometry(8, 2, 3.5), mat(0x287ca3, .4, .2));
    body.position.y = 2.4;
    car.add(body);

    const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(4.2, 1.5, 2.7),
        new THREE.MeshStandardMaterial({
            color: 0x82eaff, transparent: true, opacity: .48, roughness: .1, metalness: .3
        })
    );
    cabin.position.set(.5, 3.8, 0);
    car.add(cabin);

    const wheelMat = mat(0x111518);
    for (const xx of [-2.5, 2.5]) {
        for (const zz of [-1.7, 1.7]) {
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.7, .7, .55, 16), wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(xx, 1.2, zz);
            car.add(wheel);
        }
    }

    car.position.set(x, 1, z);
    scene.add(car);

    cars.push({ car, speed, baseSpeed: speed, direction, jamStopped: false });
}

/* =========================================================
   GLTF LOADER
========================================================= */
const loader = new GLTFLoader();
const clickable = [];

let totalModels = 4;
let loadedModels = 0;

function updateLoadBar() {
    loadedModels++;
    const pct = (loadedModels / totalModels) * 100;
    loadFill.style.width = pct + "%";
    if (loadedModels >= totalModels) {
        setTimeout(() => loadingScreen.classList.add("hide"), 500);
    }
}

/* ---- Bade target sizes ---- */
function prepareModel(object, targetSize) {
    const box = new THREE.Box3().setFromObject(object);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    object.scale.setScalar(targetSize / Math.max(maxDim, .001));

    const newBox = new THREE.Box3().setFromObject(object);
    const center = new THREE.Vector3();
    newBox.getCenter(center);
    object.position.x -= center.x;
    object.position.z -= center.z;
    object.position.y -= newBox.min.y;

    object.traverse(c => {
        if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
    });
}

);

/* =========================================================
   INFO PANEL
========================================================= */
function showPanel(title, type, text) {
    document.getElementById("panelContent").innerHTML = `
        <h2>${title}</h2>
        <div class="type">${type}</div>
        <p>${text}</p>
    `;
    document.getElementById("panel").style.display = "block";
}

window.closePanel = function () {
    document.getElementById("panel").style.display = "none";
};

/* =========================================================
   CLICK DETECTION
========================================================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener("click", event => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    for (const item of clickable) {
        const hit = raycaster.intersectObject(item.object, true);
        if (!hit.length) continue;

        if (item.type === "school") {
            showPanel(
                "BSS Smart School",
                "EDUCATION ZONE",
                "A future-ready Beaconhouse educational facility supporting smart learning, digital education, accessibility and student innovation."
            );
        }
        if (item.type === "hospital") {
            showPanel(
                "BSS Smart Hospital",
                "HEALTHCARE ZONE",
                "A modern smart healthcare facility connected with emergency transportation, digital healthcare systems and intelligent city infrastructure."
            );
        }
        if (item.type === "society") {
            showPanel(
                "BSS Smart Society",
                "RESIDENTIAL ZONE",
                "A large connected residential community with organized housing, controlled access, smart roads and modern neighborhood infrastructure."
            );
        }
        if (item.type === "bank") {
            showPanel(
                "Smart City State Bank",
                "FINANCIAL ZONE",
                "A smart banking facility providing secure digital financial services for the connected smart city."
            );
        }
        return;
    }
});

/* =========================================================
   TRAFFIC SYSTEM
========================================================= */
const clock = new THREE.Clock();
let simulationSeconds = 0;
let trafficState = 0;

const JAM_TIME = 60;
const JAM_DURATION = 25;
const RESOLVE_DURATION = 30;

let jamStartTime = 0;
let resolveStartTime = 0;

const simulationTime = document.getElementById("simulationTime");
const trafficLevel   = document.getElementById("trafficLevel");
const trafficFlow    = document.getElementById("trafficFlow");
const aiMode         = document.getElementById("aiMode");
const trafficStateElement = document.getElementById("trafficState");
const aiMessage      = document.getElementById("aiMessage");

function showAIMessage(message) {
    aiMessage.textContent = message;
    aiMessage.classList.add("show");
    setTimeout(() => aiMessage.classList.remove("show"), 4500);
}

function setTrafficStatus(state) {
    if (state === 0) {
        trafficStateElement.textContent = "TRAFFIC NORMAL";
        trafficStateElement.style.color = "#63ddff";
        trafficLevel.textContent = "NORMAL";
        trafficFlow.textContent = "92%";
        aiMode.textContent = "MONITORING";
    }
    if (state === 1) {
        trafficStateElement.textContent = "TRAFFIC JAM";
        trafficStateElement.style.color = "#ffd15a";
        trafficLevel.textContent = "JAM";
        trafficFlow.textContent = "18%";
        aiMode.textContent = "DETECTING";
    }
    if (state === 2) {
        trafficStateElement.textContent = "AI RESOLVING";
        trafficStateElement.style.color = "#67e4ff";
        trafficLevel.textContent = "HEAVY";
        trafficFlow.textContent = "54%";
        aiMode.textContent = "OPTIMIZING";
    }
    if (state === 3) {
        trafficStateElement.textContent = "TRAFFIC CLEAR";
        trafficStateElement.style.color = "#6aff9d";
        trafficLevel.textContent = "CLEAR";
        trafficFlow.textContent = "96%";
        aiMode.textContent = "OPTIMAL";
    }
}

function activateTrafficJam() {
    trafficState = 1;
    jamStartTime = simulationSeconds;

    let queueIndex = 0;
    for (const data of cars) {
        data.jamStopped = true;
        data.speed = 0;
        data.car.position.x = -300 + queueIndex * 18;
        queueIndex++;
        if (queueIndex >= cars.length) queueIndex = 0;
    }

    setTrafficStatus(1);
    showAIMessage("AI TRAFFIC CONTROLLER: CONGESTION DETECTED");
}

function activateAIResolution() {
    trafficState = 2;
    resolveStartTime = simulationSeconds;

    for (const data of cars) {
        data.jamStopped = false;
        data.speed = data.baseSpeed * .35;
    }

    setTrafficStatus(2);
    showAIMessage("AI is optimizing traffic signals and opening alternate routes.");
}

function clearTraffic() {
    trafficState = 3;
    for (const data of cars) {
        data.jamStopped = false;
        data.speed = data.baseSpeed;
    }
    setTrafficStatus(3);
    showAIMessage("AI TRAFFIC CONTROLLER: TRAFFIC FLOW RESTORED");
}

function updateCars() {
    for (const data of cars) {
        if (trafficState === 0) data.speed = data.baseSpeed;
        if (trafficState === 1) data.speed = 0;
        if (trafficState === 2) {
            const elapsed = simulationSeconds - resolveStartTime;
            const progress = Math.min(elapsed / RESOLVE_DURATION, 1);
            data.speed = data.baseSpeed * (.35 + progress * .65);
        }
        if (trafficState === 3) data.speed = data.baseSpeed;

        data.car.position.x += data.speed * data.direction;

        if (data.car.position.x >  700) data.car.position.x = -700;
        if (data.car.position.x < -700) data.car.position.x =  700;
    }
}

function updateTrafficLights(time) {
    trafficLights.forEach(light => {
        const cycle = (time + light.phase) % 12;
        light.red.material.emissiveIntensity = 0;
        light.yellow.material.emissiveIntensity = 0;
        light.green.material.emissiveIntensity = 0;

        if (cycle < 5)      light.red.material.emissiveIntensity = 3;
        else if (cycle < 7) light.yellow.material.emissiveIntensity = 3;
        else                light.green.material.emissiveIntensity = 3;
    });
}

function updateTrafficSystem() {
    if (trafficState === 0 && simulationSeconds >= JAM_TIME) {
        activateTrafficJam();
    }
    if (trafficState === 1 && simulationSeconds - jamStartTime >= JAM_DURATION) {
        activateAIResolution();
    }
    if (trafficState === 2 && simulationSeconds - resolveStartTime >= RESOLVE_DURATION) {
        clearTraffic();
    }
}

function updateTimer() {
    const total = Math.floor(simulationSeconds);
    const m = Math.floor(total / 60);
    const s = total % 60;
    simulationTime.textContent =
        String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

/* =========================================================
   ANIMATION
========================================================= */
function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    const elapsed = clock.elapsedTime;

    simulationSeconds += delta;

    updateTimer();
    updateTrafficSystem();
    updateCars();
    updateTrafficLights(elapsed);

    turbines.forEach(t => { t.rotation.z = elapsed * 2.3; });

    signal.scale.setScalar(1 + Math.sin(elapsed * 4) * .08);

    controls.update();
    renderer.render(scene, camera);
}

setTrafficStatus(0);
animate();

/* =========================================================
   RESIZE
========================================================= */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
