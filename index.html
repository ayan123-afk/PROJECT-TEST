<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSS World — 3D Smart City 2027</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#05080d;
}

#app{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* LOADING */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#102337 0%,#05080d 55%,#020305 100%);
    color:white;
    transition:.7s ease;
}

#loading h1{
    margin:0;
    font-size:42px;
    letter-spacing:6px;
}

#loading p{
    margin:12px 0 25px;
    color:#8ca8bc;
    letter-spacing:2px;
}

.loader{
    width:280px;
    height:5px;
    background:#17222c;
    border-radius:10px;
    overflow:hidden;
}

#loaderBar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00aaff,#00ffff);
    transition:.25s;
}

/* HUD */

#hud{
    position:fixed;
    top:18px;
    left:18px;
    right:18px;
    z-index:50;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.logo,
.status,
#controls button,
#hint,
#infoPanel{
    background:rgba(3,10,17,.82);
    backdrop-filter:blur(14px);
}

.logo{
    padding:13px 18px;
    border:1px solid rgba(0,200,255,.3);
    border-radius:12px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.logo strong{
    display:block;
    color:#fff;
    font-size:20px;
    letter-spacing:3px;
}

.logo span{
    display:block;
    margin-top:4px;
    color:#4fdfff;
    font-size:11px;
    letter-spacing:2px;
}

.status{
    padding:11px 15px;
    border:1px solid rgba(0,200,255,.25);
    border-radius:12px;
    color:#b7d5e4;
    font-size:12px;
    text-align:right;
}

.status b{
    color:#45e4ff;
}

/* CONTROLS */

#controls{
    position:fixed;
    bottom:18px;
    left:18px;
    z-index:50;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

button{
    border:1px solid rgba(0,210,255,.35);
    background:rgba(4,11,18,.86);
    color:#d8f8ff;
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:12px;
    transition:.2s;
}

button:hover{
    background:#073044;
    border-color:#19d9ff;
    transform:translateY(-1px);
}

/* INFO PANEL */

#infoPanel{
    position:fixed;
    right:18px;
    top:100px;
    width:340px;
    max-height:calc(100vh - 140px);
    overflow:auto;
    z-index:60;
    padding:20px;
    border-radius:16px;
    border:1px solid rgba(0,220,255,.3);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    color:#d9edf5;
    transform:translateX(380px);
    transition:.35s ease;
}

#infoPanel.open{
    transform:translateX(0);
}

#infoPanel h2{
    margin:0 0 5px;
    color:white;
    font-size:23px;
}

.subtitle{
    color:#42dcff;
    font-size:11px;
    letter-spacing:1.5px;
    margin-bottom:18px;
}

#infoPanel p{
    color:#a8c1cc;
    line-height:1.65;
    font-size:13px;
}

.feature{
    margin:8px 0;
    padding:9px 11px;
    border-left:2px solid #14cfff;
    background:rgba(20,207,255,.055);
    font-size:12px;
}

.close{
    position:absolute;
    top:10px;
    right:10px;
    padding:5px 9px;
}

#hint{
    position:fixed;
    bottom:18px;
    right:18px;
    z-index:50;
    padding:9px 13px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.08);
    color:#8ca5b2;
    font-size:11px;
}

@media(max-width:700px){

    #infoPanel{
        width:calc(100vw - 30px);
        right:15px;
    }

    #hint{
        display:none;
    }

    .status{
        display:none;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="loading">
    <h1>BSS WORLD</h1>
    <p>3D SMART CITY • 2027</p>

    <div class="loader">
        <div id="loaderBar"></div>
    </div>
</div>

<div id="hud">

</div>

<div id="controls">

    </button>

    </button>

    <button id="hospitalBtn">
        Hospital
    </button>

</div>

<div id="infoPanel">

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x071019);

scene.fog =
    new THREE.Fog(
        0x071019,
        250,
        650
    );


/* CAMERA */

const camera =
    new THREE.PerspectiveCamera(
        50,
        window.innerWidth /
        window.innerHeight,
        .1,
        1500
    );

camera.position.set(
    175,
    155,
    190
);


/* RENDERER */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.15;

document
.getElementById("app")
.appendChild(
    renderer.domElement
);


/* CONTROLS */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping=true;
controls.dampingFactor=.06;

controls.minDistance=30;
controls.maxDistance=500;

controls.maxPolarAngle=
    Math.PI*.48;

controls.target.set(
    0,
    0,
    0
);


/* =========================================================
   LIGHTING
========================================================= */

const hemisphere =
    new THREE.HemisphereLight(
        0xbde8ff,
        0x172018,
        2.3
    );

scene.add(hemisphere);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3.3
    );

sun.position.set(
    100,
    220,
    100
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-300;
sun.shadow.camera.right=300;
sun.shadow.camera.top=300;
sun.shadow.camera.bottom=-300;

scene.add(sun);


const cityLight =
    new THREE.PointLight(
        0x00bfff,
        7,
        350
    );

cityLight.position.set(
    0,
    80,
    0
);

scene.add(cityLight);


/* =========================================================
   CITY
========================================================= */

const city =
    new THREE.Group();

scene.add(city);


const animatedTrees=[];
const movingCars=[];
const walkingStudents=[];
const animatedWater=[];
const turbines=[];

const clickable=[];


/* MATERIAL */

function material(
    color,
    roughness=.75,
    metalness=.05
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });
}


/* BOX */

function createBox(
    width,
    height,
    depth,
    color,
    x,
    y,
    z
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material(color)
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    city.add(mesh);

    return mesh;
}


/* =========================================================
   GROUND
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            520,
            520
        ),
        material(0x1d3023)
    );

ground.rotation.x=
    -Math.PI/2;

ground.receiveShadow=true;

city.add(ground);


/* =========================================================
   BORDER ROADS
========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .35,
                depth
            ),
            material(
                0x252a2d,
                .95,
                .02
            )
        );

    road.position.set(
        x,
        .18,
        z
    );

    road.receiveShadow=true;

    city.add(road);


    const lineMaterial =
        new THREE.MeshBasicMaterial({
            color:0xffffff
        });


    if(width > depth){

        for(
            let p=-width/2+15;
            p<width/2;
            p+=22
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        9,
                        .04,
                        .5
                    ),
                    lineMaterial
                );

            line.position.set(
                x+p,
                .39,
                z
            );

            city.add(line);
        }

    }else{

        for(
            let p=-depth/2+15;
            p<depth/2;
            p+=22
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .5,
                        .04,
                        9
                    ),
                    lineMaterial
                );

            line.position.set(
                x,
                .39,
                z+p
            );

            city.add(line);
        }
    }
}


createRoad(
    0,
    -225,
    520,
    30
);

createRoad(
    0,
    225,
    520,
    30
);

createRoad(
    -225,
    0,
    30,
    520
);

createRoad(
    225,
    0,
    30,
    520
);


/* =========================================================
   INNER ROADS
========================================================= */

function innerRoad(
    x,
    z,
    width,
    depth
){

    const r =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .25,
                depth
            ),

        );

    r.position.set(
        x,
        .15,
        z
    );

    r.receiveShadow=true;

}


innerRoad(
    0,
    0,
    18,
    390
);

innerRoad(
    0,
    0,
    390,
    18
);

innerRoad(
    -105,
    0,
    12,
    390
);

innerRoad(
    105,
    0,
    12,
    390
);

innerRoad(
    0,
    -105,
    390,
    12
);

innerRoad(
    0,
    105,
    390,
    12
);


/* =========================================================
   SIDEWALKS
========================================================= */

function sidewalk(
    x,
    z,
    width,
    depth
){

    const s =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                1,
                depth
            ),
            material(
                0x5b6163,
                .9
            )
        );

    s.position.set(
        x,
        .5,
        z
    );

    s.receiveShadow=true;

    city.add(s);
}


sidewalk(
    0,
    -209,
    520,
    7
);

sidewalk(
    0,
    209,
    520,
    7
);

sidewalk(
    -209,
    0,
    7,
    520
);

sidewalk(
    209,
    0,
    7,
    520
);


/* =========================================================
   GLB LOADER
========================================================= */

const loader =
    new GLTFLoader();


function loadModel(
    filename,
    position,
    scale,
    type,
    callback
){

    loader.load(

        filename,

        function(gltf){

            const model =
                gltf.scene;

            model.position.copy(
                position
            );

            model.scale.setScalar(
                scale
            );


            model.traverse(
                function(object){

                    if(object.isMesh){

                        object.castShadow=true;
                        object.receiveShadow=true;

                    }

                }
            );


            model.userData.cityType=
                type;


            city.add(model);


            if(type)
                clickable.push(model);


            if(callback)
                callback(
                    model,
                    gltf
                );

        },

        function(xhr){

            if(xhr.total){

                const percent =
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    );

                document
                .getElementById(
                    "loaderBar"
                )
                .style.width=
                    percent+"%";
            }

        },

        function(error){

            console.error(
                "GLB loading error:",
                filename,
                error
            );

        }
    );
}


/* =========================================================
   SCHOOL CAMPUS
========================================================= */

const schoolX=-105;
const schoolZ=-105;


/* campus ground */

const schoolGround =
    new THREE.Mesh(

schoolGround.receiveShadow=true;

campusWall(

campusWall(

    schoolX-44,

campusWall(

);


/* entrance gate */

createBox(

    2,
    0x1b2b34,

    4,

);


/* gate pillars */

        createBox(
            2.5,

);


/* school sign */

createBox(
    16,
    3,
    .5,
    0x0b2b3a,

    7,
    schoolZ+42.5
);


/* school model */

loadModel(
    "high_school.glb",

    new THREE.Vector3(
        schoolX,
        .7,
        schoolZ
    ),

    13,

    "school"
);


/* =========================================================
   SCHOOL PARKING
========================================================= */

const parking =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            35,
            .2,
            20
        ),
        material(0x252a2d,.95)
    );

parking.position.set(
    schoolX,
    .6,
    schoolZ-55
);

parking.receiveShadow=true;

city.add(parking);


for(
    let x=-15;
    x<=15;
    x+=7
){

    const stripe =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .25,
                .04,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xffffff

        );

    );

}


/* =========================================================
   HOSPITAL
========================================================= */

const hospitalX=5;
const hospitalZ=-115;


/* hospital ground */

const hospitalGround =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            92,
            .3,
            72
        ),
        material(0x465653)
    );

hospitalGround.position.set(
    hospitalX,
    .45,
    hospitalZ
);

hospitalGround.receiveShadow=true;

city.add(
    hospitalGround
);


/* hospital model */

loadModel(
    "stylized_modern_hospital.glb",

    new THREE.Vector3(
        hospitalX,
        .7,
        hospitalZ
    ),

    11,

    "hospital"
);


/* =========================================================
   MAPLE TREES
========================================================= */

/*
   Multiple maple_tree.glb copies.
   Each tree gets its own phase and wind settings.
*/

const treePositions=[

    [-150,-150],
    [-125,-150],
    [-80,-150],

    [-155,-120],
    [-155,-90],

    [-130,-70],
    [-90,-68],

    [-60,-135],

    [55,-150],
    [90,-150],
    [125,-150],

    [150,-125],
    [150,-90],

    [-150,70],
    [-125,100],
    [-95,130],

    [-55,150],
    [-20,150],
    [20,150],
    [55,150],

    [90,80],
    [120,105],
    [150,135],

    [65,-60],
    [135,-55]
];


treePositions.forEach(
    ([x,z],index)=>{

        loadModel(

            "maple_tree.glb",

            new THREE.Vector3(
                x,
                0,
                z
            ),

            5,

            null,

            function(tree){

                tree.userData.windPhase=
                    index*.55;

                tree.userData.windStrength=
                    .035+
                    Math.random()*.025;

                tree.userData.originalRotation=
                    tree.rotation.z;

                animatedTrees.push(
                    tree
                );

            }
        );

    }
);

/* =========================================================
   WATER RECYCLING
========================================================= */

const waterX=-105;

/* =========================================================
   SOLAR PARK
========================================================= */

for(

/* =========================================================
   WIND TURBINES
========================================================= */

function createTurbine(
    x,
    z
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    city.add(group);


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                1,
                1.5,
                25,
                12
            ),
            material(
                0xd6dde0,
                .45,
                .5
            )
        );

    pole.position.y=12.5;

    pole.castShadow=true;

    group.add(pole);


    const rotor =
        new THREE.Group();

    rotor.position.y=25;

    group.add(rotor);


    const center =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.2,
                16,
                16
            ),
            material(
                0xf0f5f7,
                .35,
                .5
            )
        );

    for(

function createCar(
    color,
    x,
    z,
    speed
){

    const car =
        new THREE.Group();

    car.position.set(
        x,
        1.15,
        z
    );

    car.userData.speed=
        speed;


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,
                1.5,
                2.7
            ),
            material(
                color,
                .45,
                .15
            )
        );

    body.castShadow=true;

    car.add(body);


    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.5,
                1.1,
                2.3
            ),
            material(
                0x26313a,
                .25,
                .1
            )
        );

    roof.position.y=1.2;

    car.add(roof);


    [-1.7,1.7].forEach(
        wx=>{

            [-1.1,1.1].forEach(
                wz=>{

                    const wheel =
                        new THREE.Mesh(
                            new THREE.CylinderGeometry(
                                .55,
                                .55,
                                .35,
                                16
                            ),
                            material(
                                0x101214,
                                .9
                            )
                        );

                    wheel.rotation.z=
                        Math.PI/2;

                    wheel.position.set(
                        wx,
                        -.65,
                        wz
                    );

                    car.add(wheel);

                }
            );

        }
    );


    city.add(car);

    movingCars.push(car);
}

/* =========================================================
   RAYCAST CLICK
========================================================= */

const raycaster=
    new THREE.Raycaster();

const mouse=
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "click",
    function(event){

        const rect=
            renderer.domElement
            .getBoundingClientRect();

        mouse.x=
            ((event.clientX-
            rect.left)/
            rect.width)*2-1;

        mouse.y=
            -((event.clientY-
            rect.top)/
            rect.height)*2+1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits=
            raycaster.intersectObjects(
                clickable,
                true
            );


        if(
            hits.length>0
        ){

            let object=
                hits[0].object;

            let type=null;

            while(
                object
            ){

                if(
                    object.userData &&
                    object.userData.cityType
                ){

                    type=
                        object.userData.cityType;

                    break;
                }

                object=
                    object.parent;
            }


            if(type)
                showInfo(type);
        }

    }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock=
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const time=
        clock.getElapsedTime();


    /* Maple tree wind */

    animatedTrees.forEach(
        tree=>{

            const phase=
                tree.userData.windPhase || 0;

            const strength=
                tree.userData.windStrength || .04;

            /*
              Gentle bending.
              We rotate around Z/X very slightly,
              producing a natural wind effect.
            */

            tree.rotation.z=
                Math.sin(
                    time*1.15+
                    phase
                )*strength;

            tree.rotation.x=
                Math.sin(
                    time*.8+
                    phase*1.7
                )*strength*.55;

        }
    );


    /* Water movement */

    animatedWater.forEach(
        (water,index)=>{

            water.scale.y=
                1+
                Math.sin(
                    time*2+
                    index
                )*.025;

        }
    );


    /* Wind turbines */

    turbines.forEach(
        rotor=>{

            rotor.rotation.z+=
                .035;

        }
    );


    /* Moving cars */

    movingCars.forEach(
        car=>{

            car.position.x +=
                car.userData.speed;


            if(
                car.position.x>245
            ){

                car.position.x=-245;

            }

            if(
                car.position.x<-245
            ){

                car.position.x=245;

            }

        }
    );


    /* Walking students */

    walkingStudents.forEach(
        (student,index)=>{

            const phase=
                student.userData.phase;

            student.position.x +=
                Math.sin(
                    time*.5+
                    phase
                )*.008;

            student.position.z +=
                Math.cos(
                    time*.45+
                    phase
                )*.008;

            student.rotation.y=
                Math.sin(
                    time*.5+
                    phase
                )*.15;

        }
    );


    controls.update();

    renderer.render(
        scene,
        camera
    );
}
