<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BSS WORLD — 3D Smart City</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#a9dcf4;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

#ui{
    position:fixed;
    top:18px;
    left:18px;
    z-index:50;
    padding:19px 25px;
    border:1px solid rgba(75,220,255,.45);
    border-radius:17px;
    background:rgba(3,13,22,.90);
    backdrop-filter:blur(16px);
    box-shadow:0 15px 55px rgba(0,0,0,.3);
}

#ui .title{
    font-size:28px;
    font-weight:900;
    letter-spacing:5px;
}

#ui .sub{
    margin-top:7px;
    color:#70e4ff;
    font-size:12px;
    letter-spacing:1.4px;
}

#trafficStatus{
    position:fixed;
    top:18px;
    right:18px;
    z-index:50;
    width:315px;
    padding:18px;
    border-radius:17px;
    background:rgba(3,13,22,.92);
    border:1px solid rgba(70,220,255,.35);
    backdrop-filter:blur(16px);
}

#trafficStatus .heading{
    color:#70e4ff;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:9px;
}

#trafficState{
    font-size:21px;
    font-weight:900;
    margin-bottom:13px;
}

#trafficInfo{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.infoBox{
    padding:10px;
    border-radius:10px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
}

.infoBox span{
    display:block;
    color:#91a5ae;
    font-size:9px;
    letter-spacing:1px;
    margin-bottom:4px;
}

.infoBox strong{
    font-size:13px;
}

#aiMessage{
    position:fixed;
    left:50%;
    top:100px;
    transform:translateX(-50%);
    z-index:55;
    padding:12px 24px;
    border-radius:12px;
    background:rgba(3,14,22,.95);
    border:1px solid rgba(90,225,255,.4);
    color:#c9f5ff;
    font-size:12px;
    opacity:0;
    transition:.4s;
}

#aiMessage.show{
    opacity:1;
}

#panel{
    position:fixed;
    right:18px;
    top:185px;
    width:380px;
    display:none;
    z-index:60;
    padding:25px;
    border-radius:18px;
    background:rgba(3,13,22,.97);
    border:1px solid rgba(70,220,255,.4);
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

#panel h2{
    color:#68e2ff;
    margin-bottom:9px;
    font-size:23px;
}

#panel .type{
    color:#8097a2;
    font-size:11px;
    letter-spacing:1.5px;
    margin-bottom:16px;
}

#panel p{
    color:#d0dce1;
    line-height:1.7;
    font-size:13px;
}

.close{
    position:absolute;
    right:12px;
    top:12px;
    width:32px;
    height:32px;
    border:0;
    border-radius:8px;
    background:#172731;
    color:white;
    font-size:19px;
    cursor:pointer;
}

#hint{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    padding:11px 20px;
    border-radius:12px;
    background:rgba(3,14,22,.90);
    border:1px solid rgba(255,255,255,.14);
    color:#d2e1e7;
    font-size:12px;
    white-space:nowrap;
}
</style>
</head>

<body>

<div id="ui">
    <div class="title">BSS WORLD</div>
    <div class="sub">
        3D SMART CITY • BEACONHOUSE SCHOOL SYSTEM
    </div>
</div>

<div id="trafficStatus">

    <div class="heading">
        AI TRAFFIC MANAGEMENT
    </div>

    <div id="trafficState">

    </div>

    <div id="trafficInfo">

            <span>SIMULATION</span>

        </div>

        <div class="infoBox">
            <span>TRAFFIC</span>
            <strong id="trafficLevel">NORMAL</strong>
        </div>

        <div class="infoBox">
            <span>FLOW</span>
            <strong id="trafficFlow">92%</strong>
        </div>

        <div class="infoBox">

<div id="aiMessage">

</div>

<div id="panel">

</div>

<div id="hint">
    Drag = Rotate &nbsp; | &nbsp;
    Wheel = Zoom &nbsp; | &nbsp;
    Click School / Hospital / Society / Bank / Farm
</div>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xa9dcf4);

scene.fog = new THREE.Fog(
    0xa9dcf4,
    900,
    2700
);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        52,
        window.innerWidth / window.innerHeight,
        .1,
        3000
    );

camera.position.set(
    1250,
    820,
    1350
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.25;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = .055;

controls.minDistance = 100;

controls.maxDistance = 2600;

controls.target.set(
    0,
    5,
    0
);


/* =========================================================
   DAYLIGHT
========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0xf4fbff,
        0x315c38,
        3.4
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        5.2
    );

sun.position.set(
    -600,
    1000,
    500
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -1300;
sun.shadow.camera.right = 1300;
sun.shadow.camera.top = 1300;
sun.shadow.camera.bottom = -1300;

scene.add(sun);


/* =========================================================
   MATERIALS
========================================================= */

function material(
    color,
    roughness=.8,
    metalness=0
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });

}


const grassMaterial =
    material(
        0x4d8f50,
        .98
    );


const grassDarkMaterial =
    material(
        0x28633a,
        .95
    );


const zoneMaterial =
    material(
        0x72ad58,
        .96
    );


const zoneDarkMaterial =
    material(
        0x3f7c43,
        .9
    );


const roadMaterial =
    material(
        0x20272a,
        .96
    );


const roadShoulderMaterial =
    material(
        0x30383a,
        .92
    );


const roadLineMaterial =
    material(
        0xf3f5f2,
        .65
    );


const yellowLineMaterial =
    material(
        0xf5c84b,
        .65
    );


const curbMaterial =
    material(
        0x697578,
        .88
    );


const darkMaterial =
    material(
        0x182327,
        .65,
        .15
    );


const blueMaterial =
    material(
        0x087fa8,
        .35,
        .25
    );


const whiteMaterial =
    material(
        0xe8eeee,
        .7
    );


/* =========================================================
   LARGE GREEN WORLD GROUND
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            3300,
            3300
        ),
        grassMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   LARGE CITY BASE
========================================================= */

const CITY_W = 1700;
const CITY_D = 1250;

const cityBase =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            CITY_W,
            8,
            CITY_D
        ),
        grassDarkMaterial
    );

cityBase.position.y =
    0;

cityBase.receiveShadow = true;

scene.add(cityBase);


/* =========================================================
   SINGLE GREEN CITY BOUNDARY
========================================================= */

function createBoundary(){

    const y = 4.3;

    const thickness = 9;

    const front =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                CITY_W + 30,
                .8,
                thickness
            ),
            zoneMaterial
        );

    front.position.set(
        0,
        y,
        CITY_D/2 + 15
    );

    scene.add(front);


    const back =
        front.clone();

    back.position.z =
        -CITY_D/2 - 15;

    scene.add(back);


    const left =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                thickness,
                .8,
                CITY_D + 30
            ),
            zoneMaterial
        );

    left.position.set(
        -CITY_W/2 - 15,
        y,
        0
    );

    scene.add(left);


    const right =
        left.clone();

    right.position.x =
        CITY_W/2 + 15;

    scene.add(right);

}

createBoundary();


/* =========================================================
   ZONE AREA
========================================================= */

function createZone(
    x,
    z,
    width,
    depth
){

    const zone =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .35,
                depth
            ),
            zoneMaterial
        );

    zone.position.set(
        x,
        4.25,
        z
    );

    zone.receiveShadow = true;

    scene.add(zone);


    const trim =
        new THREE.LineSegments(
            new THREE.EdgesGeometry(
                new THREE.BoxGeometry(
                    width - 8,
                    .4,
                    depth - 8
                )
            ),
            new THREE.LineBasicMaterial({
                color:0x356d3b,
                transparent:true,
                opacity:.8
            })
        );

    trim.position.set(
        x,
        4.5,
        z
    );

    scene.add(trim);

}


/* =========================================================
   BUILDING DISTRICTS
========================================================= */

createZone(
    -690,
    -210,
    440,
    320
);

createZone(
    250,
    -210,
    440,
    320
);

createZone(
    -260,
    210,
    480,
    330
);

createZone(
    350,
    210,
    390,
    330
);


/* =========================================================
   ROADS
========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const shoulder =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width + 7,
                .25,
                depth + 7
            ),
            roadShoulderMaterial
        );

    shoulder.position.set(
        x,
        4.45,
        z
    );

    scene.add(shoulder);


    const road =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .45,
                depth
            ),
            roadMaterial
        );

    road.position.set(
        x,
        4.7,
        z
    );

    road.receiveShadow = true;

    scene.add(road);


    if(width > depth){

        const center =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    width,
                    .08,
                    .5
                ),
                yellowLineMaterial
            );

        center.position.set(
            x,
            5.0,
            z
        );

        scene.add(center);


        for(
            let i=-width/2+18;
            i<width/2-10;
            i+=34
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        15,
                        .08,
                        .45
                    ),
                    roadLineMaterial
                );

            line.position.set(
                x+i,
                5.05,
                z+5
            );

            scene.add(line);


            const line2 =
                line.clone();

            line2.position.z =
                z-5;

            scene.add(line2);

        }

    }

    else{

        const center =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .5,
                    .08,
                    depth
                ),
                yellowLineMaterial
            );

        center.position.set(
            x,
            5.0,
            z
        );

        scene.add(center);


        for(
            let i=-depth/2+18;
            i<depth/2-10;
            i+=34
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .45,
                        .08,
                        15
                    ),
                    roadLineMaterial
                );

            line.position.set(
                x+5,
                5.05,
                z+i
            );

            scene.add(line);


            const line2 =
                line.clone();

            line2.position.x =
                x-5;

            scene.add(line2);

        }

    }

}


/* =========================================================
   OUTER ROADS
========================================================= */

createRoad(
    0,
    -635,
    1740,
    34
);

createRoad(
    0,
    635,
    1740,
    34
);

createRoad(
    -855,
    0,
    34,
    1250
);

createRoad(
    855,
    0,
    34,
    1250
);


/* =========================================================
   INTERNAL ROADS
========================================================= */

for(
    const z of [-400,0,400]
){

    createRoad(
        0,
        z,
        1680,
        24
    );

}


for(
    const x of [-520,0,520]
){

    createRoad(
        x,
        0,
        24,
        1200
    );

}


/* =========================================================
   CROSSWALKS
========================================================= */

function createCrosswalk(
    x,
    z,
    horizontal=true
){

    for(
        let i=-18;
        i<=18;
        i+=6
    ){

        let w,d;

        if(horizontal){
            w=3;
            d=32;
        }

        else{
            w=32;
            d=3;
        }

        const stripe =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    w,
                    .09,
                    d
                ),
                roadLineMaterial
            );

        if(horizontal){

            stripe.position.set(
                x+i,
                5.1,
                z
            );

        }

        else{

            stripe.position.set(
                x,
                5.1,
                z+i
            );

        }

        scene.add(stripe);

    }

}


for(
    const x of [-520,0,520]
){

    for(
        const z of [-400,0,400]
    ){

        createCrosswalk(
            x,
            z,
            true
        );

        createCrosswalk(
            x,
            z,
            false
        );

    }

}


/* =========================================================
   SIDEWALKS
========================================================= */

function createSidewalk(
    x,
    z,
    width,
    depth
){

    const sidewalk =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .28,
                depth
            ),
            curbMaterial
        );

    sidewalk.position.set(
        x,
        5.05,
        z
    );

    scene.add(sidewalk);

}


createSidewalk(
    -690,
    -380,
    430,
    7
);

createSidewalk(
    250,
    -380,
    430,
    7
);

createSidewalk(
    -260,
    390,
    470,
    7
);

createSidewalk(
    350,
    390,
    380,
    7
);


/* =========================================================
   3D BOARD
========================================================= */

function createBoard(
    text,
    x,
    y,
    z,
    width=70,
    height=10
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        y,
        z
    );


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .5,
                .7,
                13,
                12
            ),
            darkMaterial
        );

    pole.position.y =
        6.5;

    group.add(pole);


    const spike =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .9,
                3.2,
                8
            ),
            darkMaterial
        );

    spike.position.y =
        14.6;

    group.add(spike);


    const board =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                .7
            ),
            blueMaterial
        );

    board.position.y =
        10;

    group.add(board);


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 2200;
    canvas.height = 600;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#075c7b";

    ctx.fillRect(
        0,
        0,
        2200,
        600
    );

    ctx.strokeStyle =
        "#78e9ff";

    ctx.lineWidth = 16;

    ctx.strokeRect(
        12,
        12,
        2176,
        576
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 145px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        text,
        1100,
        300
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    const sign =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width-1,
                height-.8
            ),
            new THREE.MeshBasicMaterial({
                map:texture,
                side:THREE.DoubleSide
            })
        );

    sign.position.set(
        0,
        10,
        .37
    );

    group.add(sign);

    scene.add(group);

    return group;
}

   BOARDS

createBoard(

/* =========================================================
   STREET LIGHTS
========================================================= */

function createStreetLight(
    x,
    z
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        5,
        z
    );


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .22,
                .3,
                11,
                10
            ),
            darkMaterial
        );

    pole.position.y =
        5.5;

    group.add(pole);


    const arm =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4,
                .22,
                .22
            ),
            darkMaterial
        );

    arm.position.set(
        1.7,
        9.7,
        0
    );

    group.add(arm);


    const bulb =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .52,
                14,
                14
            ),
            new THREE.MeshStandardMaterial({
                color:0xfff2b0,
                emissive:0xffd36a,

            })

}


for(

    x<=780;

){

    createStreetLight(

    );

    );

/* =========================================================
   TRAFFIC LIGHTS
========================================================= */

const trafficLights=[];


function createTrafficLight(
    x,
    z,
    rotation=0
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        5,
        z
    );

    group.rotation.y =
        rotation;


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .2,
                .25,
                9,
                8
            ),
            darkMaterial
        );

    pole.position.y =
        4.5;

    group.add(pole);


    const box =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.7,
                5,
                1.4
            ),
            material(
                0x15191c,
                .5
            )
        );

    box.position.y =
        7.5;

    group.add(box);


    function light(
        color,
        y
    ){

        const mesh =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .35,
                    14,
                    14
                ),
                new THREE.MeshStandardMaterial({
                    color,
                    emissive:color,
                    emissiveIntensity:0
                })
            );

        mesh.position.set(
            0,
            y,
            .75
        );

        group.add(mesh);

        return mesh;

    }


    const red =
        light(
            0xff2222,
            8.8
        );

    const yellow =
        light(
            0xffcc22,
            7.4
        );

    const green =
        light(
            0x22ff66,
            6
        );


    scene.add(group);


    trafficLights.push({
        red,
        yellow,
        green,
        phase:Math.random()*10
    });

}


for(
    const x of [-520,0,520]
){

    for(

/* =========================================================
   MODEL PREPARATION
========================================================= */

function prepareModel(
    object,
    targetSize
){

    const box =
        new THREE.Box3()
        .setFromObject(object);


    const size =
        new THREE.Vector3();

    box.getSize(size);


    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    object.scale.setScalar(
        targetSize /
        Math.max(
            maxDimension,
            .001
        )
    );


    const newBox =
        new THREE.Box3()
        .setFromObject(object);


    const center =
        new THREE.Vector3();

    newBox.getCenter(
        center
    );


    object.position.x -=
        center.x;

    object.position.z -=
        center.z;

    object.position.y -=
        newBox.min.y;


    object.traverse(
        child => {

            if(
                child.isMesh
            ){

                child.castShadow = true;

                child.receiveShadow = true;

            }

        }
    );

}

/* =========================================================
   TRAFFIC JAM
========================================================= */

function activateTrafficJam(){

    trafficState = 1;

    jamStartTime =
        simulationSeconds;


    let queueIndex = 0;


    for(
        const data of cars
    ){

        data.jamStopped = true;

        data.speed = 0;


        data.car.position.x =
            -220 +
            queueIndex * 22;


        queueIndex++;

    }


    setTrafficStatus(1);


    showAIMessage(
        "AI TRAFFIC CONTROLLER: CONGESTION DETECTED"
    );

}


/* =========================================================
   AI RESOLUTION
========================================================= */

function activateAIResolution(){

    trafficState = 2;

    resolveStartTime =
        simulationSeconds;


    for(
        const data of cars
    ){

        data.jamStopped = false;

        data.speed =
            data.baseSpeed * .35;

    }


    setTrafficStatus(2);


    showAIMessage(
        "AI IS OPTIMIZING TRAFFIC SIGNALS AND OPENING ALTERNATE ROUTES"
    );

}


/* =========================================================
   TRAFFIC CLEAR
========================================================= */

function clearTraffic(){

    trafficState = 3;


    for(
        const data of cars
    ){

        data.jamStopped = false;

        data.speed =
            data.baseSpeed;

    }


    setTrafficStatus(3);


    showAIMessage(
        "AI TRAFFIC CONTROLLER: TRAFFIC FLOW RESTORED"
    );

}


/* =========================================================
   CAR MOVEMENT
========================================================= */

function updateCars(){

    for(
        const data of cars
    ){

        if(
            trafficState === 0
        ){

            data.speed =
                data.baseSpeed;

        }


        if(
            trafficState === 1
        ){

            data.speed = 0;

        }


        if(
            trafficState === 2
        ){

            const elapsed =
                simulationSeconds -
                resolveStartTime;


            const progress =
                Math.min(
                    elapsed /
                    RESOLVE_DURATION,
                    1
                );


            data.speed =
                data.baseSpeed *
                (
                    .35 +
                    progress * .65
                );

        }


        if(
            trafficState === 3
        ){

            data.speed =
                data.baseSpeed;

        }


        data.car.position.x +=
            data.speed *
            data.direction;


        if(
            data.car.position.x > 840
        ){

            data.car.position.x =
                -840;

        }


        if(
            data.car.position.x < -840
        ){

            data.car.position.x =
                840;

        }

    }

}


/* =========================================================
   TRAFFIC LIGHTS
========================================================= */

function updateTrafficLights(
    time
){

    trafficLights.forEach(
        light => {

            let cycleLength = 12;

            if(
                trafficState === 2
            ){

                cycleLength = 7;

            }


            const cycle =
                (
                    time +
                    light.phase
                ) % cycleLength;


            light.red
            .material
            .emissiveIntensity = 0;

            light.yellow
            .material
            .emissiveIntensity = 0;

            light.green
            .material
            .emissiveIntensity = 0;


            if(
                cycle < cycleLength*.42
            ){

                light.red
                .material
                .emissiveIntensity = 3;

            }

            else if(
                cycle < cycleLength*.58
            ){

                light.yellow
                .material
                .emissiveIntensity = 3;

            }

            else{

                light.green
                .material
                .emissiveIntensity = 3;

            }

        }
    );

}


/* =========================================================
   TRAFFIC STATE MACHINE
========================================================= */

function updateTrafficSystem(){

    if(
        trafficState === 0 &&
        simulationSeconds >= JAM_TIME
    ){

        activateTrafficJam();

    }


    if(
        trafficState === 1 &&
        simulationSeconds -
        jamStartTime >=
        JAM_DURATION
    ){

        activateAIResolution();

    }


    if(
        trafficState === 2 &&
        simulationSeconds -
        resolveStartTime >=
        RESOLVE_DURATION
    ){

        clearTraffic();

    }

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

    const total =
        Math.floor(
            simulationSeconds
        );


    const minutes =
        Math.floor(
            total / 60
        );


    const seconds =
        total % 60;


    simulationTime.textContent =

        String(minutes)
        .padStart(2,"0")

        +

        ":"

        +

        String(seconds)
        .padStart(2,"0");

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();

    const elapsed =
        clock.elapsedTime;


    simulationSeconds +=
        delta;


    updateTimer();

    updateTrafficSystem();

    updateCars();

    updateTrafficLights(
        elapsed
    );


    /* =====================================================
       ROTATE ALL 20 WIND TURBINES
    ===================================================== */

    turbines.forEach(
        blades => {

            blades.rotation.z =
                elapsed * 2.4;

        }
    );


    /* =====================================================
       AI CONTROLLER SIGNAL
    ===================================================== */

    signal.scale.setScalar(
        1 +
        Math.sin(
            elapsed * 4
        ) * .08
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   START
========================================================= */

setTrafficStatus(0);

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
