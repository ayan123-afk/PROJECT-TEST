}

#ui .sub{

#trafficStatus{

#aiMessage{

    font-size:12px;

.close{

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0xa9dcf4);

scene.fog =
    new THREE.Fog(
        0xa9dcf4,
        650,
        1600
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        52,
        window.innerWidth /
        window.innerHeight,
        .1,
        2200
    );

camera.position.set(
    500,
    360,
    520
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.3;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = .055;

controls.minDistance = 80;

controls.maxDistance = 1100;

controls.target.set(
    0,
    5,
    0
);


/* =========================================================
   BRIGHT DAY LIGHT
========================================================= */

    new THREE.HemisphereLight(
        0xf2fbff,
        0x73916b,
        3.6
    );

scene.add(ambient);


const sun =

        0xffffff,
        5.5
    );

sun.position.set(
    -300,
    500,
    250
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;

sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -700;

sun.shadow.camera.right = 700;

sun.shadow.camera.top = 700;

/* =========================================================
   MATERIAL
========================================================= */

function material(
    color,
    roughness=.8,
    metalness=0
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });

}

    material(
        0x477a4b,
        .95

const roadMaterial =

        .35,
        .25

========================================================= */

/* =========================================================
   ROAD FUNCTION
========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .45,
                depth
            ),
            roadMaterial
        );

    road.position.set(
        x,
        1.25,
        z
    );

    road.receiveShadow = true;

    scene.add(road);


    if(width > depth){

        for(
            let i=-width/2+10;
            i<width/2;
            i+=22
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        12,
                        .08,
                        .42
                    ),
                    roadLineMaterial
                );

            line.position.set(
                x+i,
                1.51,
                z
            );

            scene.add(line);
        }

    }
    else{

        for(
            let i=-depth/2+10;
            i<depth/2;
            i+=22
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .42,
                        .08,
                        12
                    ),
                    roadLineMaterial
                );

            line.position.set(
                x,
                1.51,
                z+i
            );

            scene.add(line);
        }

    }

}

/* =========================================================
   LARGE FIXED 3D BOARD
========================================================= */

function createBoard(
    text,
    x,
    y,
    z,
    width=65,
    height=9
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        y,
        z
    );


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .5,
                .7,
                13,
                12
            ),
            material(
                0x303a40,
                .5,
                .25
            )
        );

    pole.position.y =
        6.5;

    pole.castShadow = true;

    group.add(pole);


    const spike =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .9,
                3.2,
                8
            ),
            material(
                0x4b5960,
                .5,
                .25
            )
        );

    spike.position.y =
        14.6;

    group.add(spike);


    const board =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                .7
            ),
            blueMaterial
        );

    board.position.y =
        10;

    board.castShadow = true;

    group.add(board);


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 2200;

    canvas.height = 600;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#075c7b";

    ctx.fillRect(
        0,
        0,
        2200,
        600
    );


    ctx.strokeStyle =
        "#78e9ff";

    ctx.lineWidth = 16;

    ctx.strokeRect(
        12,
        12,
        2176,
        576
    );


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 145px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        text,
        1100,
        300
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;


    const sign =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width-1,
                height-.8
            ),
            new THREE.MeshBasicMaterial({
                map:texture,
                side:THREE.DoubleSide
            })
        );

    sign.position.set(
        0,
        10,
        .37
    );

    group.add(sign);


    scene.add(group);

    return group;
}

/* =========================================================
   WIND TURBINES
========================================================= */

const turbines=[];


function createTurbine(
    x,
    z,
    scale=1
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    group.scale.setScalar(
        scale
    );


    const tower =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .8,
                1.2,
                35,
                14
            ),
            whiteMaterial
        );

    tower.position.y =
        17.5;

    tower.castShadow = true;

    group.add(tower);


    const hub =
        new THREE.Group();

    hub.position.set(
        0,
        35,
        0
    );


    const center =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.2,
                18,
                18
            ),
            whiteMaterial
        );

    hub.add(center);


    for(
        let i=0;
        i<3;
        i++
    ){

        const blade =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1,
                    14,
                    .45
                ),
                whiteMaterial
            );

        blade.position.y =
            7;

        blade.rotation.z =
            i*Math.PI*2/3;

        blade.geometry.translate(
            0,
            6,
            0
        );

        hub.add(blade);

    }


    group.add(hub);

    scene.add(group);

    turbines.push(hub);
}

const cars=[];


function createCar(
    x,
    z,
    speed,
    direction=1
){

    const car =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                8,
                2,
                3.5
            ),
            material(
                0x287ca3,
                .4,
                .2
            )
        );

    body.position.y =
        2.4;

    car.add(body);


    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.2,
                1.5,
                2.7
            ),
            new THREE.MeshStandardMaterial({
                color:0x82eaff,
                transparent:true,
                opacity:.48,
                roughness:.1,
                metalness:.3
            })
        );

    cabin.position.set(
        .5,
        3.8,
        0
    );

    car.add(cabin);


    const wheelMat =
        material(
            0x111518
        );


    for(
        const xx of [-2.5,2.5]
    ){

        for(
            const zz of [-1.7,1.7]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .7,
                        .7,
                        .55,
                        16
                    ),
                    wheelMat
                );

            wheel.rotation.z =
                Math.PI/2;

            wheel.position.set(
                xx,
                1.2,
                zz
            );

            car.add(wheel);

        }

    }


    car.position.set(
        x,
        1,
        z
    );

    scene.add(car);


    cars.push({
        car,
        speed,
        baseSpeed:speed,
        direction,
        jamStopped:false
    });

}

/* =========================================================
   PREPARE MODEL
========================================================= */

function prepareModel(
    object,
    targetSize
){

    const box =
        new THREE.Box3()
        .setFromObject(object);


    const size =
        new THREE.Vector3();

    box.getSize(size);


    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    object.scale.setScalar(
        targetSize /
        Math.max(
            maxDimension,
            .001
        )
    );


    const newBox =
        new THREE.Box3()
        .setFromObject(object);


    const center =
        new THREE.Vector3();

    newBox.getCenter(
        center
    );


    object.position.x -=
        center.x;

    object.position.z -=
        center.z;

    object.position.y -=
        newBox.min.y;


    object.traverse(
        child => {

            if(
                child.isMesh
            ){

                child.castShadow = true;

                child.receiveShadow = true;

            }

        }
    );

}

        raycaster.setFromCamera(

        for(

/* =========================================================
   TRAFFIC SYSTEM
========================================================= */

const clock =
    new THREE.Clock();

let simulationSeconds = 0;

let trafficState = 0;

const JAM_TIME = 60;

const JAM_DURATION = 25;

const RESOLVE_DURATION = 30;

let jamStartTime = 0;

let resolveStartTime = 0;


/* =========================================================
   UI
========================================================= */

const simulationTime =
    document.getElementById(
        "simulationTime"
    );

const trafficLevel =
    document.getElementById(
        "trafficLevel"
    );

const trafficFlow =
    document.getElementById(
        "trafficFlow"
    );

const aiMode =
    document.getElementById(
        "aiMode"
    );

const trafficStateElement =
    document.getElementById(
        "trafficState"
    );

const aiMessage =
    document.getElementById(
        "aiMessage"
    );


/* =========================================================
   AI MESSAGE
========================================================= */

function showAIMessage(
    message
){

    aiMessage.textContent =
        message;

    aiMessage.classList.add(
        "show"
    );


    setTimeout(
        () => {

            aiMessage.classList.remove(
                "show"
            );

        },
        4500
    );

}


/* =========================================================
   TRAFFIC STATUS
========================================================= */

function setTrafficStatus(
    state
){

    if(state === 0){

        trafficStateElement.textContent =
            "TRAFFIC NORMAL";

        trafficStateElement.style.color =
            "#63ddff";

        trafficLevel.textContent =
            "NORMAL";

        trafficFlow.textContent =
            "92%";

        aiMode.textContent =
            "MONITORING";

    }


    if(state === 1){

        trafficStateElement.textContent =
            "TRAFFIC JAM";

        trafficStateElement.style.color =
            "#ffd15a";

        trafficLevel.textContent =
            "JAM";

        trafficFlow.textContent =
            "18%";

        aiMode.textContent =
            "DETECTING";

    }


    if(state === 2){

        trafficStateElement.textContent =
            "AI RESOLVING";

        trafficStateElement.style.color =
            "#67e4ff";

        trafficLevel.textContent =
            "HEAVY";

        trafficFlow.textContent =
            "54%";

        aiMode.textContent =
            "OPTIMIZING";

    }


    if(state === 3){

        trafficStateElement.textContent =
            "TRAFFIC CLEAR";

        trafficStateElement.style.color =
            "#6aff9d";

        trafficLevel.textContent =
            "CLEAR";

        trafficFlow.textContent =
            "96%";

        aiMode.textContent =
            "OPTIMAL";

    }

}


/* =========================================================
   TRAFFIC JAM
========================================================= */

function activateTrafficJam(){

    trafficState = 1;

    jamStartTime =
        simulationSeconds;


    let queueIndex = 0;


    for(
        const data of cars
    ){

        data.jamStopped = true;

        data.speed = 0;


        data.car.position.x =
            -150 +
            queueIndex * 14;


        queueIndex++;

        if(
            queueIndex >= cars.length
        ){

            queueIndex = 0;

        }

    }


    setTrafficStatus(1);


    showAIMessage(
        "AI TRAFFIC CONTROLLER: CONGESTION DETECTED"
    );

}


/* =========================================================
   AI RESOLUTION
========================================================= */

function activateAIResolution(){

    trafficState = 2;

    resolveStartTime =
        simulationSeconds;


    for(
        const data of cars
    ){

        data.jamStopped = false;

        data.speed =
            data.baseSpeed * .35;

    }


    setTrafficStatus(2);


    showAIMessage(
        "AI is optimizing traffic signals and opening alternate routes."
    );

}


/* =========================================================
   TRAFFIC CLEAR
========================================================= */

function clearTraffic(){

    trafficState = 3;


    for(
        const data of cars
    ){

        data.jamStopped = false;

        data.speed =
            data.baseSpeed;

    }


    setTrafficStatus(3);


    showAIMessage(
        "AI TRAFFIC CONTROLLER: TRAFFIC FLOW RESTORED"
    );

}


/* =========================================================
   CAR MOVEMENT
========================================================= */

function updateCars(){

    for(
        const data of cars
    ){

        if(
            trafficState === 0
        ){

            data.speed =
                data.baseSpeed;

        }


        if(
            trafficState === 1
        ){

            data.speed = 0;

        }


        if(
            trafficState === 2
        ){

            const elapsed =
                simulationSeconds -
                resolveStartTime;


            const progress =
                Math.min(
                    elapsed /
                    RESOLVE_DURATION,
                    1
                );


            data.speed =
                data.baseSpeed *
                (
                    .35 +
                    progress * .65
                );

        }


        if(
            trafficState === 3
        ){

            data.speed =
                data.baseSpeed;

        }


        data.car.position.x +=
            data.speed *
            data.direction;


        if(
            data.car.position.x > 345
        ){

            data.car.position.x =
                -345;

        }


        if(
            data.car.position.x < -345
        ){

            data.car.position.x =
                345;

        }

    }

}


/* =========================================================
   TRAFFIC LIGHTS
========================================================= */

function updateTrafficLights(
    time
){

    trafficLights.forEach(
        light => {

            const cycle =
                (
                    time +
                    light.phase
                ) % 12;


            light.red
            .material
            .emissiveIntensity = 0;

            light.yellow
            .material
            .emissiveIntensity = 0;

            light.green
            .material
            .emissiveIntensity = 0;


            if(
                cycle < 5
            ){

                light.red
                .material
                .emissiveIntensity = 3;

            }

            else if(
                cycle < 7
            ){

                light.yellow
                .material
                .emissiveIntensity = 3;

            }

            else{

                light.green
                .material
                .emissiveIntensity = 3;

            }

        }
    );

}


/* =========================================================
   TRAFFIC STATE MACHINE
========================================================= */

function updateTrafficSystem(){

    /* 1 MINUTE */

    if(
        trafficState === 0 &&
        simulationSeconds >= JAM_TIME
    ){

        activateTrafficJam();

    }


    /* AI STARTS */

    if(
        trafficState === 1 &&
        simulationSeconds -
        jamStartTime >=
        JAM_DURATION
    ){

        activateAIResolution();

    }


    /* FULL RESTORE */

    if(
        trafficState === 2 &&
        simulationSeconds -
        resolveStartTime >=
        RESOLVE_DURATION
    ){

        clearTraffic();

    }

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

    const total =
        Math.floor(
            simulationSeconds
        );


    const minutes =
        Math.floor(
            total / 60
        );


    const seconds =
        total % 60;


    simulationTime.textContent =

        String(minutes)
        .padStart(2,"0")

        +

        ":"

        +

        String(seconds)
        .padStart(2,"0");

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();

    const elapsed =
        clock.elapsedTime;


    simulationSeconds +=
        delta;


    updateTimer();

    updateTrafficSystem();

    updateCars();

    updateTrafficLights(
        elapsed
    );


    turbines.forEach(
        turbine => {

            turbine.rotation.z =
                elapsed * 2.3;

        }
    );


    signal.scale.setScalar(
        1 +
        Math.sin(
            elapsed * 4
        ) * .08
    );


    controls.update();

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   START
========================================================= */

setTrafficStatus(0);

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
