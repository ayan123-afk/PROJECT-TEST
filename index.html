<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    overflow:hidden;
    background:#9fd4ef;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

#ui{
    position:fixed;
    top:18px;
    left:18px;
    z-index:50;
    padding:18px 24px;
    border:1px solid rgba(80,220,255,.45);
    border-radius:16px;
    background:rgba(3,13,22,.90);

}

#ui .title{
    font-size:27px;
    font-weight:900;
    letter-spacing:5px;
}

#ui .sub{
    margin-top:7px;
    color:#73e5ff;
    font-size:12px;
    letter-spacing:1.4px;
}

#trafficStatus{
    position:fixed;
    top:18px;
    right:18px;
    z-index:50;
    width:310px;
    padding:18px;
    border-radius:16px;
    background:rgba(3,13,22,.92);
    border:1px solid rgba(70,220,255,.35);
    backdrop-filter:blur(16px);
    box-shadow:0 15px 50px rgba(0,0,0,.32);
}

#trafficStatus .heading{
    color:#70e4ff;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:9px;
}

#trafficState{
    font-size:21px;
    font-weight:900;
    margin-bottom:13px;
}

#trafficInfo{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.infoBox{
    padding:10px;
    border-radius:10px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
}

.infoBox span{
    display:block;
    color:#91a5ae;
    font-size:9px;
    letter-spacing:1px;
    margin-bottom:4px;
}

.infoBox strong{
    font-size:13px;
}

#aiMessage{
    position:fixed;
    left:50%;
    top:95px;
    transform:translateX(-50%);
    z-index:55;
    padding:11px 22px;
    border-radius:12px;
    background:rgba(3,14,22,.94);
    border:1px solid rgba(90,225,255,.35);
    color:#c9f5ff;
    font-size:12px;
    letter-spacing:.5px;
    opacity:0;
    transition:.4s;
}

#aiMessage.show{
    opacity:1;
}

#panel{
    position:fixed;
    right:18px;
    top:185px;
    width:370px;
    display:none;
    z-index:60;
    padding:25px;
    border-radius:18px;
    background:rgba(3,13,22,.97);
    border:1px solid rgba(70,220,255,.4);
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

#panel h2{
    color:#68e2ff;
    margin-bottom:9px;
    font-size:23px;
}

#panel .type{
    color:#8097a2;
    font-size:11px;
    letter-spacing:1.5px;
    margin-bottom:16px;
}

#panel p{
    color:#d0dce1;
    line-height:1.7;
    font-size:13px;
}

.close{
    position:absolute;
    right:12px;
    top:12px;
    width:32px;
    height:32px;
    border:0;
    border-radius:8px;
    background:#172731;
    color:white;
    font-size:19px;
    cursor:pointer;
}

#hint{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    padding:11px 20px;
    border-radius:12px;
    background:rgba(3,14,22,.90);
    border:1px solid rgba(255,255,255,.14);
    color:#d2e1e7;
    font-size:12px;
    white-space:nowrap;
}

@media(max-width:700px){

    #ui{
        transform:scale(.78);

    }

    #trafficStatus{
        transform:scale(.75);
        transform-origin:top right;
    }

    #panel{
        width:310px;
    }

    #hint{
        font-size:10px;
    }
}
</style>
</head>

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x9fd4ef);

scene.fog =
    new THREE.Fog(
        0x9fd4ef,
        500,
        1300
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        52,
        window.innerWidth /
        window.innerHeight,
        .1,
        1800
    );

camera.position.set(
    330,
    245,
    350
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.25;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = .055;

controls.minDistance = 65;

controls.maxDistance = 780;

controls.target.set(
    0,
    5,
    10
);


/* =========================================================
   DAY LIGHT
========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0xeaf9ff,
        0x6a8b62,
        3.2
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        5.2
    );

sun.position.set(
    -220,
    360,
    180
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;

sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -500;

sun.shadow.camera.right = 500;

sun.shadow.camera.top = 500;

sun.shadow.camera.bottom = -500;

scene.add(sun);


/* =========================================================
   MATERIAL
========================================================= */

function material(
    color,
    roughness=.8,
    metalness=0
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });

}


/* =========================================================
   MATERIALS
========================================================= */

const groundMaterial =
    material(
        0x3f7046,
        .95
    );

const roadMaterial =
    material(
        0x20262b,
        .95
    );

const roadLineMaterial =
    material(
        0xf2f5f5,
        .7
    );

const curbMaterial =
    material(
        0x9aa5a8,
        .9
    );

const whiteMaterial =
    material(
        0xf2f5f5,
        .65
    );

const blueMaterial =
    material(
        0x087ca5,
        .35,
        .25
    );


/* =========================================================
   GROUND
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1000,
            1000
        ),
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   CITY PLATFORM
========================================================= */

const city =

        new THREE.BoxGeometry(
            430,

city.position.set(
    0,
    .5,
    0
);

city.receiveShadow = true;

scene.add(city);


/* =========================================================
   ROAD
========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .45,
                depth
            ),
            roadMaterial
        );

    road.position.set(
        x,
        1.25,
        z
    );

    road.receiveShadow = true;

    scene.add(road);


    if(width > depth){

        for(
            let i=-width/2+8;
            i<width/2;
            i+=17
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        9,
                        .08,
                        .38
                    ),
                    roadLineMaterial
                );

            line.position.set(
                x+i,
                1.5,
                z
            );

            scene.add(line);
        }

    }
    else{

        for(
            let i=-depth/2+8;
            i<depth/2;
            i+=17
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .38,
                        .08,
                        9
                    ),
                    roadLineMaterial
                );

            line.position.set(
                x,
                1.5,
                z+i
            );

            scene.add(line);
        }

    }

}

/* =========================================================
   LARGE 3D BOARD
========================================================= */

function createBoard(
    text,
    x,
    y,
    z,
    width=45,
    height=7
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        y,
        z
    );


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .45,
                .6,
                11,
                12
            ),
            material(
                0x303a40,
                .55,
                .2
            )
        );

    pole.position.y = 5.5;

    pole.castShadow = true;

    group.add(pole);


    const spike =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .8,
                3,
                8
            ),
            material(
                0x4a5960,
                .5,
                .25
            )
        );

    spike.position.y = 12.5;

    group.add(spike);


    const board =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                .65
            ),
            blueMaterial
        );

    board.position.y = 8.5;

    board.castShadow = true;

    group.add(board);


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 2000;

    canvas.height = 500;

    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle = "#075c7b";

    ctx.fillRect(
        0,
        0,
        2000,
        500
    );


    ctx.strokeStyle = "#72e6ff";

    ctx.lineWidth = 14;

    ctx.strokeRect(
        12,
        12,
        1976,
        476
    );


    ctx.fillStyle = "#ffffff";

    ctx.font =
        "bold 125px Arial";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";


    ctx.fillText(
        text,
        1000,
        250
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;


    const sign =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width-1,
                height-.7
            ),
            new THREE.MeshBasicMaterial({
                map:texture,
                side:THREE.DoubleSide
            })
        );

    sign.position.set(
        0,
        8.5,
        .34
    );

    group.add(sign);


    scene.add(group);

    return group;
}

   STREET LIGHTS
========================================================= */

){

            ),

                0x69757a,
                .7
            )
        );

    arm.position.set(
        1.5,

    );

    const bulb =

/* =========================================================
   TRAFFIC LIGHTS
========================================================= */

const trafficLights=[];


function createTrafficLight(
    x,
    z,
    rotation=0
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    group.rotation.y =
        rotation;


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(

                .24,
                8,

            ),
            curbMaterial
        );

    pole.position.y = 4;

    group.add(pole);


    const box =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.6,
                4.8,
                1.3
            ),
            material(
                0x15191c,
                .5
            )
        );

    box.position.y = 7;

    group.add(box);


    const red =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .34,
                14,
                14
            ),
            new THREE.MeshStandardMaterial({
                color:0xff2222,
                emissive:0xff0000,
                emissiveIntensity:0
            })
        );

    red.position.set(
        0,
        8.3,
        .7
    );

    group.add(red);


    const yellow =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .34,
                14,
                14
            ),
            new THREE.MeshStandardMaterial({
                color:0xffcc22,
                emissive:0xffaa00,
                emissiveIntensity:0
            })
        );

    yellow.position.set(
        0,
        7,
        .7
    );

    group.add(yellow);


    const green =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .34,
                14,
                14
            ),
            new THREE.MeshStandardMaterial({
                color:0x22ff66,
                emissive:0x00ff44,

            })
        );

    green.position.set(
        0,
        5.7,

    );

    group.add(green);


    scene.add(group);


    trafficLights.push({
        red,
        yellow,
        green,
        phase:Math.random()*10
    });

}

/* =========================================================
   WIND ENERGY
========================================================= */

const turbines=[];


function createTurbine(
    x,
    z,
    scale=1
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    group.scale.setScalar(scale);


    const tower =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .75,
                1.15,
                32,
                14
            ),
            whiteMaterial
        );

    tower.position.y = 16;

    tower.castShadow = true;

    group.add(tower);


    const hub =
        new THREE.Group();

    hub.position.set(
        0,
        32,
        0
    );


    const center =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2,
                18,
                18
            ),
            whiteMaterial
        );

    hub.add(center);


    for(
        let i=0;
        i<3;
        i++
    ){

        const blade =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .9,
                    12,
                    .4
                ),
                whiteMaterial
            );

        blade.position.y = 6;

        blade.rotation.z =
            i*Math.PI*2/3;

        blade.geometry.translate(
            0,
            5,
            0
        );

        hub.add(blade);

    }


    group.add(hub);

    scene.add(group);

    turbines.push(hub);

}

/* =========================================================
   CARS
========================================================= */

const cars=[];


function createCar(
    lane,
    z,
    speed,
    direction=1
){

    const car =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                7,
                1.8,
                3.2
            ),
            material(
                0x287ca3,
                .4,
                .2
            )
        );

    body.position.y = 2.3;

    car.add(body);


    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.8,
                1.4,
                2.5
            ),
            new THREE.MeshStandardMaterial({
                color:0x82eaff,
                transparent:true,
                opacity:.48,
                roughness:.1,
                metalness:.3
            })
        );

    cabin.position.set(
        .5,
        3.6,
        0
    );

    car.add(cabin);


    const wheelMat =
        material(0x111518);


    for(
        const xx of [-2.3,2.3]
    ){

        for(
            const zz of [-1.6,1.6]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .65,
                        .65,
                        .5,
                        16
                    ),
                    wheelMat
                );

            wheel.rotation.z =
                Math.PI/2;

            wheel.position.set(
                xx,

                zz
            );

            car.add(wheel);

        }

    }

        z
    );

        car,
        speed,
        baseSpeed:speed,
        direction,
        jamStopped:false
    });

}

/* =========================================================
   PREPARE MODEL
========================================================= */

function prepareModel(
    object,
    targetSize
){

    const box =
        new THREE.Box3()
        .setFromObject(object);


    const size =
        new THREE.Vector3();

    box.getSize(size);


    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    object.scale.setScalar(
        targetSize /
        Math.max(
            maxDimension,
            .001
        )
    );


    const newBox =
        new THREE.Box3()
        .setFromObject(object);


    const center =
        new THREE.Vector3();

    newBox.getCenter(center);


    object.position.x -=
        center.x;

    object.position.z -=
        center.z;

    object.position.y -=
        newBox.min.y;


    object.traverse(
        child => {

            if(child.isMesh){

                child.castShadow = true;

                child.receiveShadow = true;

            }

        }
    );

}

/* =========================================================

========================================================= */

const clock =
    new THREE.Clock();


let simulationSeconds = 0;

let trafficState = 0;


/*
=========================================================
IMPORTANT:

60 SECONDS = TRAFFIC JAM
=========================================================
*/

const JAM_TIME = 60;


/*
JAM STAYS FOR 25 SECONDS
*/

const JAM_DURATION = 25;


/*
AI TAKES 30 SECONDS TO FULLY
RESTORE TRAFFIC
*/

const RESOLVE_DURATION = 30;


let jamStartTime = 0;

let resolveStartTime = 0;


/* =========================================================
   UI ELEMENTS
========================================================= */

const simulationTime =
    document.getElementById(
        "simulationTime"
    );

const trafficLevel =
    document.getElementById(
        "trafficLevel"

const trafficFlow =
    document.getElementById(

const aiMode =

    document.getElementById(
        "trafficState"

const aiMessage =

/* =========================================================
   AI MESSAGE
========================================================= */

function showAIMessage(
    message
){

    aiMessage.textContent =
        message;

    aiMessage.classList.add(
        "show"
    );


    setTimeout(
        () => {

            aiMessage.classList.remove(
                "show"

        },
        4500
    );

}


/* =========================================================
   TRAFFIC STATUS
========================================================= */

function setTrafficStatus(
    state
){

    if(state === 0){

        trafficStateElement.textContent =
            "TRAFFIC NORMAL";

        trafficStateElement.style.color =
            "#63ddff";

        trafficLevel.textContent =
            "NORMAL";

        trafficFlow.textContent =
            "92%";

        aiMode.textContent =
            "MONITORING";

    }


    if(state === 1){

        trafficStateElement.textContent =
            "TRAFFIC JAM";

        trafficStateElement.style.color =
            "#ffd15a";

        trafficLevel.textContent =
            "JAM";

        trafficFlow.textContent =
            "18%";

        aiMode.textContent =
            "DETECTING";

    }


    if(state === 2){

        trafficStateElement.textContent =
            "AI RESOLVING";

        trafficStateElement.style.color =
            "#67e4ff";

        trafficLevel.textContent =
            "HEAVY";

        trafficFlow.textContent =
            "54%";

        aiMode.textContent =
            "OPTIMIZING";

    }


    if(state === 3){

        trafficStateElement.textContent =
            "TRAFFIC CLEAR";

        trafficStateElement.style.color =
            "#6aff9d";

        trafficLevel.textContent =
            "CLEAR";

        trafficFlow.textContent =
            "96%";

        aiMode.textContent =
            "OPTIMAL";

    }

}


/* =========================================================
   ACTIVATE TRAFFIC JAM
========================================================= */

function activateTrafficJam(){

    trafficState = 1;

    jamStartTime =
        simulationSeconds;


    let queueIndex = 0;


    for(
        const data of cars
    ){

        data.jamStopped = true;

        data.speed = 0;


        /*
        MAKE A VISIBLE TRAFFIC QUEUE
        */

        data.car.position.x =
            -125 +
            queueIndex * 12;

        queueIndex++;

    }


    setTrafficStatus(1);


    showAIMessage(
        "AI TRAFFIC CONTROLLER: CONGESTION DETECTED"
    );

}


/* =========================================================
   AI RESOLUTION
========================================================= */

function activateAIResolution(){

    trafficState = 2;

    resolveStartTime =
        simulationSeconds;


    for(
        const data of cars
    ){

        data.jamStopped = false;

        data.speed =
            data.baseSpeed * .35;

    }


    setTrafficStatus(2);


    showAIMessage(
        "AI is optimizing signals and opening an alternate traffic route."
    );

}


/* =========================================================
   CLEAR TRAFFIC
========================================================= */

function clearTraffic(){

    trafficState = 3;


    for(
        const data of cars
    ){

        data.jamStopped = false;

        data.speed =
            data.baseSpeed;

    }


    setTrafficStatus(3);


    showAIMessage(
        "AI TRAFFIC CONTROLLER: TRAFFIC FLOW RESTORED"
    );

}


/* =========================================================
   UPDATE CARS
========================================================= */

function updateCars(){

    for(
        const data of cars
    ){

        if(
            trafficState === 0
        ){

            data.speed =
                data.baseSpeed;

        }


        if(
            trafficState === 1
        ){

            if(
                data.jamStopped
            ){

                data.speed = 0;

            }
            else{

                data.speed =
                    data.baseSpeed * .2;

            }

        }


        if(
            trafficState === 2
        ){

            const elapsed =
                simulationSeconds -
                resolveStartTime;


            const progress =
                Math.min(
                    elapsed /
                    RESOLVE_DURATION,
                    1
                );


            data.speed =
                data.baseSpeed *
                (
                    .35 +
                    progress * .65
                );

        }


        if(
            trafficState === 3
        ){

            data.speed =
                data.baseSpeed;

        }


        data.car.position.x +=
            data.speed *
            data.direction;


        if(
            data.car.position.x > 225
        ){

            data.car.position.x = -225;

        }


        if(
            data.car.position.x < -225
        ){

            data.car.position.x = 225;

        }

    }

}


/* =========================================================
   TRAFFIC LIGHT SYSTEM
========================================================= */

function updateTrafficLights(
    time
){

    trafficLights.forEach(
        light => {

            const cycleLength =
                trafficState === 2
                ? 8
                : 12;


            const cycle =
                (
                    time +
                    light.phase
                ) %
                cycleLength;


            light.red
            .material
            .emissiveIntensity = 0;

            light.yellow
            .material
            .emissiveIntensity = 0;

            light.green
            .material
            .emissiveIntensity = 0;


            if(
                cycle < 5
            ){

                light.red
                .material
                .emissiveIntensity = 3;

            }

            else if(
                cycle < 7
            ){

                light.yellow
                .material
                .emissiveIntensity = 3;

            }

            else{

                light.green
                .material
                .emissiveIntensity = 3;

            }

        }
    );

}


/* =========================================================
   TRAFFIC STATE MACHINE
========================================================= */

function updateTrafficSystem(){

    /*
    NORMAL → JAM AFTER 60 SECONDS
    */

    if(
        trafficState === 0 &&
        simulationSeconds >= JAM_TIME
    ){

        activateTrafficJam();

    }


    /*
    JAM → AI AFTER 25 SECONDS
    */

    if(
        trafficState === 1 &&
        simulationSeconds -
        jamStartTime >=
        JAM_DURATION
    ){

        activateAIResolution();

    }


    /*
    AI → CLEAR AFTER 30 SECONDS
    */

    if(
        trafficState === 2 &&
        simulationSeconds -
        resolveStartTime >=
        RESOLVE_DURATION
    ){

        clearTraffic();

    }

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

    const total =
        Math.floor(
            simulationSeconds
        );


    const minutes =
        Math.floor(
            total / 60
        );


    const seconds =
        total % 60;


    simulationTime.textContent =

        String(minutes)
        .padStart(2,"0")

        +

        ":"

        +

        String(seconds)
        .padStart(2,"0");

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();

    const elapsed =
        clock.elapsedTime;


    simulationSeconds +=
        delta;


    updateTimer();

    updateTrafficSystem();

    updateCars();

    updateTrafficLights(
        elapsed
    );


    /* WIND TURBINES */

    turbines.forEach(
        turbine => {

            turbine.rotation.z =
                elapsed * 2.3;

        }
    );


    /* AI SIGNAL */

    signal.scale.setScalar(
        1 +
        Math.sin(
            elapsed * 4
        ) * .08
    );


    controls.update();

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   START
========================================================= */

setTrafficStatus(0);

animate();


/* =========================================================
   RESIZE
========================================================= */

    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);
