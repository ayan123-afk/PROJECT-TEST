function addTextSprite(text,pos){

  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 180;

  const ctx = canvas.getContext("2d");

  ctx.clearRect(0,0,1024,180);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 70px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(text,512,90);

  const texture = new THREE.CanvasTexture(canvas);

  const material = new THREE.SpriteMaterial({
    map:texture,
    transparent:true
  });

  const sprite = new THREE.Sprite(material);

  sprite.position.copy(pos);
  sprite.scale.set(32,5.6,1);

  scene.add(sprite);

  return sprite;
}

function prepareModel(object,targetSize=65){

  const box=new THREE.Box3().setFromObject(object);

  const size=new THREE.Vector3();
  const center=new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const maxDim=Math.max(size.x,size.y,size.z);

  const scale=targetSize/maxDim;

  object.scale.setScalar(scale);

  const newBox=new THREE.Box3().setFromObject(object);
  const newCenter=new THREE.Vector3();

  newBox.getCenter(newCenter);

  object.position.x-=newCenter.x;
  object.position.z-=newCenter.z;
  object.position.y-=newBox.min.y;

  object.traverse(child=>{

    if(child.isMesh){

      child.castShadow=true;
      child.receiveShadow=true;
    }
  });
}

/* SCHOOL */

loader.load(
  "./high_school.glb",

  gltf=>{

    schoolObject=gltf.scene;

    prepareModel(schoolObject,62);

    schoolObject.position.set(-5,1,-5);

    scene.add(schoolObject);

    clickable.push({
      object:schoolObject,
      type:"school"
    });

    addTextSprite(
      "BSS SMART SCHOOL",
      new THREE.Vector3(-5,35,-5)
    );

    checkLoaded();
  },

  xhr=>{
    if(xhr.total){
      console.log(
        "School:",
        Math.round(xhr.loaded/xhr.total*100)+"%"
      );
    }
  },

  err=>{
    console.error("School GLB loading error:",err);
    checkLoaded();
  }
);

/* =========================================================
   LOADING CONTROL
========================================================= */

let loadedCount=0;

function checkLoaded(){

  loadedCount++;

  if(loadedCount>=2){

    setTimeout(()=>{

      document.getElementById("loading").style.display="none";

    },700);
  }
}

/* =========================================================
   RAYCASTING
========================================================= */

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

renderer.domElement.addEventListener("click",event=>{

  mouse.x=(event.clientX/window.innerWidth)*2-1;
  mouse.y=-(event.clientY/window.innerHeight)*2+1;

  raycaster.setFromCamera(mouse,camera);

  for(const item of clickable){

    const hits=raycaster.intersectObject(item.object,true);

    if(hits.length){

      if(item.type==="school"){
        showSchool();
      }

      if(item.type==="hospital"){
        showHospital();
      }

      return;
    }
  }
});

/* =========================================================
   ANIMATION
========================================================= */

let clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const t=clock.getElapsedTime();

  /* student walking */

  students.forEach((s,i)=>{

    const angle=s.phase+t*s.speed;

    s.group.position.x=
      s.baseX+Math.cos(angle)*s.radius;

    s.group.position.z=
      s.baseZ+Math.sin(angle)*s.radius*.65;

    s.group.rotation.y=
      -Math.sin(angle);

    const walk=Math.sin(t*8+s.phase);

    s.legL.rotation.x=walk*.55;
    s.legR.rotation.x=-walk*.55;

    s.armL.rotation.x=-walk*.4;
    s.armR.rotation.x=walk*.4;

    s.group.position.y=
      1.5+Math.abs(Math.sin(t*8+s.phase))*.12;
  });

  /* cars */

  cars.forEach(c=>{

    c.car.position.x+=c.speed;

    if(c.car.position.x>90){
      c.car.position.x=-90;
    }
  });

  /* wind-like tree movement */

  trees.forEach((tree,i)=>{

    tree.rotation.z=
      Math.sin(t*.8+i)*.015;

    tree.rotation.x=
      Math.cos(t*.7+i)*.01;
  });

  /* lights */

  lamps.forEach((light,i)=>{

    light.intensity=
      Math.max(
        0,
        Math.sin(t*1.5+i*.4)
      )*.8;
  });

  controls.update();

  renderer.render(scene,camera);
}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener("resize",()=>{

  camera.aspect=
    window.innerWidth/window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});
