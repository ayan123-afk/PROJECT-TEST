/* =========================================================
   GLB LOADING
========================================================= */

const loader=new GLTFLoader();

const clickable=[];

function loadGLB(
 file,
 targetSize,
 x,
 z,
 name,
 description
){

 return new Promise(resolve=>{

  loader.load(
   file,

   gltf=>{

    const model=gltf.scene;

    model.traverse(o=>{
     if(o.isMesh){
      o.castShadow=true;
      o.receiveShadow=true;
     }
    });

    const box3=new THREE.Box3().setFromObject(model);
    const size=box3.getSize(new THREE.Vector3());

    const max=Math.max(size.x,size.y,size.z);

    if(max>0){

     const s=targetSize/max;

     model.scale.setScalar(s);
    }

    const b=new THREE.Box3().setFromObject(model);

    const center=b.getCenter(new THREE.Vector3());

    model.position.x-=center.x;
    model.position.z-=center.z;
    model.position.y-=b.min.y;

    model.position.x+=x;
    model.position.z+=z;
    model.position.y+=14;

    city.add(model);

    clickable.push({
     object:model,
     name,
     description
    });

    resolve(model);
   },

   xhr=>{

    const p=xhr.total?
      Math.round(xhr.loaded/xhr.total*100):
      0;

    document.getElementById("progress").textContent=
      `Loading ${name}... ${p}%`;
   },

   err=>{

    console.warn("GLB failed:",file,err);

    document.getElementById("progress").textContent=
      `Could not load ${file}`;

    resolve(null);
   }
  );

 });
}

/* =========================================================
   TRAFFIC SYSTEM
========================================================= */

const trafficBox=document.getElementById("traffic");

let startTime=performance.now();
let state="NORMAL";

const JAM_TIME=60;
const JAM_DURATION=25;
const AI_DURATION=30;

function updateTraffic(){

 const elapsed=(performance.now()-startTime)/1000;

 if(elapsed<JAM_TIME){

  state="NORMAL";

 }else if(elapsed<JAM_TIME+JAM_DURATION){

  state="JAM";

 }else if(elapsed<JAM_TIME+JAM_DURATION+AI_DURATION){

  state="AI";

 }else{

  state="CLEAR";
 }

 if(state==="NORMAL"){

  trafficBox.textContent="TRAFFIC: NORMAL";
  trafficBox.style.background="#eef8ee";

  cars.forEach(c=>{
   c.speed=c.baseSpeed;
  });

 }

 if(state==="JAM"){

  trafficBox.textContent="TRAFFIC: JAM DETECTED";
  trafficBox.style.background="#fff2df";

  cars.forEach(c=>{
   c.speed*=.02;
  });

 }

 if(state==="AI"){

  trafficBox.textContent="AI TRAFFIC CONTROL: RESOLVING";
  trafficBox.style.background="#e7f1ff";

  const progress=
   (elapsed-JAM_TIME-JAM_DURATION)/AI_DURATION;

  cars.forEach(c=>{
   c.speed=c.baseSpeed*(.25+.75*progress);
  });

 }

 if(state==="CLEAR"){

  trafficBox.textContent="TRAFFIC: CLEAR — AI OPTIMIZED";
  trafficBox.style.background="#eef8ee";

  cars.forEach(c=>{
   c.speed=c.baseSpeed;
  });

 }
}


/* =========================================================
   MOVE CARS
========================================================= */

function updateCars(){

 cars.forEach(c=>{

  if(c.horizontal){

   c.mesh.position.x+=c.speed;

   if(c.mesh.position.x>900)
    c.mesh.position.x=-900;

  }else{

   c.mesh.position.z+=c.speed;

   if(c.mesh.position.z>700)
    c.mesh.position.z=-700;

  }

 });
}

function updateLights(dt){

 const phase=Math.floor(lightTimer/3)%3;

 trafficLights.forEach(t=>{

  t.red.material.emissive.setHex(0x110000);
  t.yellow.material.emissive.setHex(0x110900);
  t.green.material.emissive.setHex(0x001100);

  if(phase===0)
   t.red.material.emissive.setHex(0xff0000);

  if(phase===1)
   t.yellow.material.emissive.setHex(0xffaa00);

  if(phase===2)
   t.green.material.emissive.setHex(0x00ff55);

 });
}


/* =========================================================
   CLICK INTERACTION
========================================================= */

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

addEventListener("pointerdown",e=>{

 mouse.x=(e.clientX/innerWidth)*2-1;
 mouse.y=-(e.clientY/innerHeight)*2+1;

 raycaster.setFromCamera(mouse,camera);

 const objects=[];

 clickable.forEach(c=>{
  c.object.traverse(o=>{
   if(o.isMesh)objects.push(o);
  });
 });

 const hits=raycaster.intersectObjects(objects,true);

 if(!hits.length)return;

 let obj=hits[0].object;

 let found=null;

 while(obj){

  found=clickable.find(c=>c.object===obj);

  if(found)break;

  obj=obj.parent;
 }

 if(found){

  document.getElementById("infoTitle").textContent=
   found.name;

  document.getElementById("infoText").textContent=
   found.description;

  document.getElementById("info").style.display="block";
 }

});


/* =========================================================
   RESIZE
========================================================= */

addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});


/* =========================================================
   ANIMATION
========================================================= */

let last=performance.now();

function animate(){

 requestAnimationFrame(animate);

 const now=performance.now();
 const dt=Math.min((now-last)/1000,.05);

 last=now;

 controls.update();

 updateTraffic();
 updateCars();
 updateLights(dt);

 /* rotate ONLY turbine blades */

 turbineBlades.forEach(blades=>{
  blades.rotation.z-=dt*1.7;
 });

 renderer.render(scene,camera);

}

animate();


/* =========================================================
   LOADING SCREEN
========================================================= */

Promise.all(assets).then(()=>{

 setTimeout(()=>{

  document.getElementById("loading").style.display="none";

 },500);

});

</script>
