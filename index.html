body{

#controls{

button{

    cursor:pointer;
    color:white;
    font-weight:bold;
}

.modeBtn{
    padding:11px 15px;

    border-radius:10px;

    background:rgba(8,30,43,.9);

    transform:translateX(-50%);

    padding:10px 18px;

    background:rgba(4,15,23,.85);

    border:1px solid rgba(255,255,255,.1);

#panel{

    right:18px;

    padding:22px;

#panel h2{

}

#panel .type{

<script type="module">

import {
    OrbitControls
}
from
"three/addons/controls/OrbitControls.js";

    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";


/* =====================================================
   SCENE
===================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
    0x08141c
);

scene.fog =
new THREE.Fog(
    0x08141c,
    350,
    1100

   CAMERA
===================================================== */

new THREE.PerspectiveCamera(
    55,
    window.innerWidth /
    window.innerHeight,

    1800
);

camera.position.set(
    310,
    210,
    340

/* =====================================================
   RENDERER
===================================================== */

const renderer =
new THREE.WebGLRenderer({

    antialias:true,

    powerPreference:
    "high-performance"

});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2

);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   CONTROLS
===================================================== */

new OrbitControls(

/* =====================================================
   MATERIALS
===================================================== */

function material(
    color,
    roughness=.8,
    metalness=0
){

    return new THREE.MeshStandardMaterial({

        color,

        roughness,

        metalness

    });

}


const groundMaterial =
material(
    0x304f35
);

const roadMaterial =
material(
    0x20272c,
    .95
);

const roadLineMaterial =
material(
    0xe9eeee
);

const concreteMaterial =
material(

);

const whiteMaterial =

);

const blueMaterial =
material(
    0x116a92,
    .4,
    .2
);

   CITY GROUND
===================================================== */

/* =====================================================
   ROADS
===================================================== */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            width,
            .4,
            depth
        ),

        roadMaterial

    );

    road.position.set(
        x,
        1.2,
        z
    );

    road.receiveShadow = true;

    scene.add(
        road
    );


    if(width > depth){

        for(
            let i=-width/2+10;
            i<width/2;
            i+=16
        ){

            const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    8,
                    .07,
                    .35
                ),

                roadLineMaterial

            );

            line.position.set(
                x+i,
                1.45,
                z
            );

            scene.add(
                line
            );

        }

    }

    else{

        for(
            let i=-depth/2+10;
            i<depth/2;
            i+=16
        ){

            const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .35,
                    .07,
                    8
                ),

                roadLineMaterial

            );

            line.position.set(
                x,
                1.45,
                z+i
            );

            scene.add(
                line
            );

        }

    }

}

/* =====================================================
   CITY DISTRICT BOARDS
===================================================== */

function createBoard(
    text,
    x,
    y,
    z,
    width=30
){

    const group =
    new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );


    const postMaterial =
    material(
        0x343e43
    );


    for(
        const px of [
            -width/2+1,
            width/2-1
        ]
    ){

        const post =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .25,
                .3,
                6,
                8
            ),

            postMaterial

        );

        post.position.set(
            px,
            3,
            0
        );

        group.add(
            post
        );

    }


    const board =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            width,
            5,
            .5
        ),

        blueMaterial

    );

    board.position.y = 6;

    board.castShadow = true;

    group.add(
        board
    );


    const canvas =
    document.createElement(
        "canvas"
    );

    canvas.width = 1000;

    canvas.height = 180;


    const ctx =
    canvas.getContext(
        "2d"
    );


    ctx.fillStyle =
    "#ffffff";

    ctx.font =
    "bold 68px Arial";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";


    ctx.fillText(
        text,
        500,
        90
    );


    const texture =
    new THREE.CanvasTexture(
        canvas
    );

    texture.colorSpace =
    THREE.SRGBColorSpace;


    const sprite =
    new THREE.Sprite(

        new THREE.SpriteMaterial({

            map:texture,

            transparent:true,

            depthTest:false

        })

    );


    sprite.position.set(
        x,
        6,
        z-.7
    );


    sprite.scale.set(
        width*1.25,
        5,
        1
    );


    scene.add(
        group
    );

    scene.add(
        sprite
    );

}

/* =====================================================
   STREET LIGHT SYSTEM
===================================================== */

const streetLights=[];

function createStreetLight(
    x,
    z
){

    const group =
    new THREE.Group();


    group.position.set(
        x,
        0,
        z
    );


    const pole =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .18,
            .25,
            9,
            8
        ),

        concreteMaterial

    );

    pole.position.y =
    4.5;

    group.add(
        pole
    );


    const arm =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            3,
            .18,
            .18
        ),

        concreteMaterial

    );

    arm.position.set(
        1.3,
        8.5,
        0
    );

    group.add(
        arm
    );


    const bulbMaterial =
    new THREE.MeshStandardMaterial({

        color:0xffffff,

        emissive:0x7edfff,

        emissiveIntensity:0

    });


    const bulb =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .45,
            12,
            12
        ),

        bulbMaterial

    );

    bulb.position.set(
        2.6,
        8.3,
        0
    );

    group.add(
        bulb
    );


    const light =
    new THREE.PointLight(
        0x8edfff,
        0,
        35
    );

    light.position.set(
        2.6,
        8,
        0
    );

    group.add(
        light
    );


    scene.add(
        group
    );


    streetLights.push({
        light,
        bulbMaterial
    });

}

/* =====================================================
   TRAFFIC SIGNAL
===================================================== */

const trafficLights=[];


function createTrafficLight(
    x,
    z,
    rotation=0
){

    const group =
    new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    group.rotation.y =
    rotation;


    const pole =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .18,
            .22,
            8,
            8
        ),

        concreteMaterial

    );

    pole.position.y=4;

    group.add(
        pole
    );


    const box =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.5,
            4.5,
            1.2
        ),

        material(
            0x181d20,
            .5
        )

    );

    box.position.y=7;

    group.add(
        box
    );


    const red =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .32,
            12,
            12
        ),

        new THREE.MeshStandardMaterial({

            color:0xff2222,

            emissive:0xff0000,

            emissiveIntensity:0

        })

    );

    red.position.set(
        0,
        8.25,
        .65
    );

    group.add(
        red
    );


    const yellow =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .32,
            12,
            12
        ),

        new THREE.MeshStandardMaterial({

            color:0xffcc22,

            emissive:0xffaa00,

            emissiveIntensity:0

        })

    );

    yellow.position.set(
        0,
        7,
        .65
    );

    group.add(
        yellow
    );


    const green =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .32,
            12,
            12
        ),

        new THREE.MeshStandardMaterial({

            color:0x22ff66,

            emissive:0x00ff44,

            emissiveIntensity:1

        })

    );

    green.position.set(
        0,
        5.75,
        .65
    );

    group.add(
        green
    );


    scene.add(
        group
    );


    trafficLights.push({

        red,
        yellow,
        green,

        phase:
        Math.random()*10

    });

}

/* =====================================================
   WIND TURBINES
===================================================== */

const turbines=[];


function createTurbine(
    x,
    z,
    scale=1
){

    const group =
    new THREE.Group();


    group.position.set(
        x,
        0,
        z
    );

    group.scale.setScalar(
        scale
    );


    const tower =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .7,
            1.1,
            30,
            12
        ),

        whiteMaterial

    );

    tower.position.y=15;

    tower.castShadow=true;

    group.add(
        tower
    );


    const hub =
    new THREE.Group();

    hub.position.set(
        0,
        30,
        0
    );


    const center =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.8,
            16,
            16
        ),

        whiteMaterial

    );

    hub.add(
        center
    );


    for(
        let i=0;
        i<3;
        i++
    ){

        const blade =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .8,
                11,
                .35
            ),

            whiteMaterial

        );

        blade.position.y=6;

        blade.rotation.z =
        i*Math.PI*2/3;

        blade.geometry.translate(
            0,
            5,
            0
        );

        hub.add(
            blade
        );

    }


    group.add(
        hub
    );

    scene.add(
        group
    );


    turbines.push(
        hub
    );

}

const cars=[];


function createCar(
    lane,
    z,
    speed,
    direction=1
){

    const car =
    new THREE.Group();


    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            7,
            1.8,
            3.2
        ),

        material(
            0x287ca3,
            .45,
            .2
        )

    );

    body.position.y=2.3;

    car.add(
        body
    );


    const cabin =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            3.7,
            1.4,
            2.5
        ),

        new THREE.MeshStandardMaterial({

            color:0x6edfff,

            transparent:true,

            opacity:.45,

            roughness:.1,

            metalness:.3

        })

    );

    cabin.position.set(
        .5,
        3.6,
        0
    );

    car.add(
        cabin
    );


    const wheelMaterial =
    material(
        0x121518
    );


    for(
        const xx of [-2.3,2.3]
    ){

        for(
            const zz of [-1.6,1.6]
        ){

            const wheel =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .65,
                    .65,
                    .5,
                    16
                ),

                wheelMaterial

            );

            wheel.rotation.z =
            Math.PI/2;

            wheel.position.set(
                xx,
                1.2,
                zz
            );

            car.add(
                wheel
            );

        }

    }


    car.position.set(
        lane,
        1,
        z
    );


    scene.add(
        car
    );


    cars.push({

        car,

        speed,

        direction

    });

}

/* =====================================================
   MODEL PREPARATION
===================================================== */

function prepareModel(
    object,
    targetSize
){

    const box =
    new THREE.Box3()
    .setFromObject(
        object
    );

    const size =
    new THREE.Vector3();

    box.getSize(
        size
    );


    const maxDimension =
    Math.max(
        size.x,
        size.y,
        size.z
    );


    object.scale.setScalar(

        targetSize /
        Math.max(
            maxDimension,
            .001
        )

    );


    const newBox =
    new THREE.Box3()
    .setFromObject(
        object
    );


    const center =
    new THREE.Vector3();


    newBox.getCenter(
        center
    );


    object.position.x -=
    center.x;

    object.position.z -=
    center.z;

    object.position.y -=
    newBox.min.y;


    object.traverse(
        child=>{

            if(
                child.isMesh
            ){

                child.castShadow=true;

                child.receiveShadow=true;

            }

        }
    );

}

/* =====================================================
   CLICK DETECTION
===================================================== */

const raycaster =
new THREE.Raycaster();

const mouse =
new THREE.Vector2();


renderer.domElement.addEventListener(
    "click",
    event=>{

        mouse.x =
        (event.clientX /
        window.innerWidth)*2-1;


        mouse.y =
        -(event.clientY /
        window.innerHeight)*2+1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        for(
            const item of clickable
        ){

            const hit =
            raycaster.intersectObject(
                item.object,
                true
            );


            if(
                hit.length
            ){

                if(
                    item.type ===
                    "school"
                ){

                    showPanel(

                        "BSS Smart School",

                        "Education Zone",

                        "A future-ready Beaconhouse educational facility designed for smart learning, digital education, accessibility and student innovation."

                    );

                }


                if(
                    item.type ===
                    "hospital"
                ){

                    showPanel(

                        "BSS Smart Hospital",

                        "Healthcare Zone",

                        "A modern smart healthcare facility connected to the city's transportation, emergency response and digital infrastructure."

                    );

                }


                return;

            }

        }

    }
);


/* =====================================================
   DAY / NIGHT SYSTEM
===================================================== */

let isNight=false;


const dayColor =
new THREE.Color(
    0x08141c
);

const nightColor =
new THREE.Color(
    0x02050a
);


const dayFog =
new THREE.Color(
    0x08141c
);

const nightFog =
new THREE.Color(
    0x02050a
);


function setDay(){

    isNight=false;


    scene.background =
    dayColor;


    scene.fog.color =
    dayFog;


    sun.intensity =
    3.5;


    ambient.intensity =
    2.2;


    streetLights.forEach(
        item=>{

            item.light.intensity=0;

            item.bulbMaterial
                .emissiveIntensity=0;

        }
    );

}


function setNight(){

    isNight=true;


    scene.background =
    nightColor;


    scene.fog.color =
    nightFog;


    sun.intensity =
    .18;


    ambient.intensity =
    .28;


    streetLights.forEach(
        item=>{

            item.light.intensity=2.2;

            item.bulbMaterial
                .emissiveIntensity=4;

        }
    );

}


document.getElementById(
    "dayBtn"
).addEventListener(
    "click",
    setDay
);


document.getElementById(
    "nightBtn"
).addEventListener(
    "click",
    setNight
);


/* =====================================================
   ANIMATION
===================================================== */

const clock =
new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
    clock.getElapsedTime();


    /* --------------------------------
       WIND TURBINES
    -------------------------------- */

    turbines.forEach(
        (turbine,index)=>{

            turbine.rotation.z =
            time*2.4;

        }
    );


    /* --------------------------------
       TRAFFIC
    -------------------------------- */

    cars.forEach(
        carData=>{

            carData.car.position.x +=
            carData.speed *
            carData.direction;


            if(
                carData.car.position.x >
                220
            ){

                carData.car.position.x =
                -220;

            }


            if(
                carData.car.position.x <
                -220
            ){

                carData.car.position.x =
                220;

            }

        }
    );


    /* --------------------------------
       AI TRAFFIC CONTROLLER
    -------------------------------- */

    controllerGroup.rotation.y =
    Math.sin(time*.4)*.015;


    signal.scale.setScalar(
        1+
        Math.sin(time*4)*.08
    );


    /* --------------------------------
       TRAFFIC LIGHTS
    -------------------------------- */

    trafficLights.forEach(
        lightData=>{

            const cycle =
            (
                time+
                lightData.phase
            )%12;


            lightData.red.material
                .emissiveIntensity=0;

            lightData.yellow.material
                .emissiveIntensity=0;

            lightData.green.material
                .emissiveIntensity=0;


            if(
                cycle < 5
            ){

                lightData.red.material
                    .emissiveIntensity=3;

            }

            else if(
                cycle < 7
            ){

                lightData.yellow.material
                    .emissiveIntensity=3;

            }

            else{

                lightData.green.material
                    .emissiveIntensity=3;

            }

        }
    );


    /* --------------------------------
       NIGHT CONTROLLER SCREEN
    -------------------------------- */

    if(isNight){

        screen.material.emissiveIntensity =
        1.5+
        Math.sin(time*3)*.3;

    }


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();

);
