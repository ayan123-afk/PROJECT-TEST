function mat(
    color,
    rough=.7,
    metal=0
){
    return new THREE.MeshStandardMaterial({
        color,
        roughness:rough,
        metalness:metal
    });
}


function box(
    w,
    h,
    d,
    color,
    y=0
){
    const m =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            mat(color)
        );

    m.position.y =
        y + h / 2;

    m.castShadow = true;
    m.receiveShadow = true;

    return m;
}


function plane(
    w,
    d,
    color,
    y=.03
){
    const m =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                w,
                d
            ),
            mat(color)
        );

    m.rotation.x =
        -Math.PI / 2;

    m.position.y = y;

    m.receiveShadow = true;

    return m;
}


function cyl(
    r,
    h,
    color
){
    const m =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                r,
                r,
                h,
                20
            ),
            mat(color)
        );

    m.position.y =
        h / 2;

    m.castShadow = true;

    return m;
}


function line(
    points,
    color=0x2b7ca5
){
    const g =
        new THREE.BufferGeometry()
        .setFromPoints(points);

    return new THREE.Line(
        g,
        new THREE.LineBasicMaterial({
            color
        })
    );
}

/* =========================================================

function board(
    text,
    x,
    z,
    w=150
){

    const g =
        new THREE.Group();

    g.position.set(
        x,
        0,
        z
    );

    const pole =
        box(
            5,
            42,
            5,
            0x424b53,
            0
        );

    const sign =
        box(
            w,
            32,
            4,
            0x12314a,
            44
        );

    g.add(
        pole,
        sign
    );


    const canvas =
        document.createElement("canvas");

    canvas.width=1000;
    canvas.height=200;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#0b2032";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.strokeStyle =
        "#52c9ff";

    ctx.lineWidth=8;

    ctx.strokeRect(
        5,
        5,
        canvas.width-10,
        canvas.height-10
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 72px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        text,
        canvas.width/2,
        canvas.height/2
    );


    const texture =
        new THREE.CanvasTexture(canvas);

    texture.colorSpace =
        THREE.SRGBColorSpace;


    const boardMesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                w-8,
                27
            ),
            new THREE.MeshBasicMaterial({
                map:texture
            })
        );

    boardMesh.position.set(
        0,
        44.3,
        2.2
    );

    g.add(boardMesh);

    city.add(g);

    return g;
}

/* =========================================================
   GLB LOADER
========================================================= */

const loader =
    new GLTFLoader();


function loadGLB(
    file,
    x,
    z,
    targetSize,
    name,
    description
){

    loader.load(
        file,

        (gltf)=>{

            const obj =
                gltf.scene;


            obj.traverse(
                o=>{

                    if(o.isMesh){

                        o.castShadow=true;
                        o.receiveShadow=true;

                        if(o.material){

                            if(
                                Array.isArray(
                                    o.material
                                )
                            ){

                                o.material.forEach(
                                    m=>{
                                        if(m)
                                            m.side =
                                                THREE.FrontSide;
                                    }
                                );

                            }else{

                                o.material.side =
                                    THREE.FrontSide;
                            }
                        }
                    }
                }
            );


            scene.updateMatrixWorld(true);


            const originalBox =
                new THREE.Box3()
                .setFromObject(obj);


            const originalSize =
                originalBox.getSize(
                    new THREE.Vector3()
                );


            const max =
                Math.max(
                    originalSize.x,
                    originalSize.y,
                    originalSize.z
                );


            if(max > 0){

                obj.scale.multiplyScalar(
                    targetSize / max
                );
            }


            scene.updateMatrixWorld(true);


            const finalBox =
                new THREE.Box3()
                .setFromObject(obj);


            const center =
                finalBox.getCenter(
                    new THREE.Vector3()
                );


            obj.position.x +=
                x-center.x;

            obj.position.z +=
                z-center.z;

            obj.position.y +=
                10-finalBox.min.y;


            city.add(obj);


            clickable.push({
                object:obj,
                title:name,
                text:description
            });


            console.log(
                "Loaded:",
                file
            );

        },

        undefined,

        error=>{

            console.warn(
                "Could not load:",
                file,
                error
            );
        }
    );
}

/* =========================================================
   WIND FARM — COMPLETELY OUTSIDE CITY
========================================================= */

const windFarm =
    new THREE.Group();


/*
   IMPORTANT:
   CITY LEFT EDGE = -850
   WIND FARM STARTS AROUND -1100
   So turbines are OUTSIDE the city.
*/


const turbinePositions = [

    [-1250,-450],
    [-1080,-450],

    [-1250,-150],
    [-1080,-150],

    [-1250,150],
    [-1080,150],

    [-1250,450],
    [-1080,450]

];


function turbine(
    x,
    z
){

    const g =
        new THREE.Group();

    g.position.set(
        x,
        0,
        z
    );


    /* tower */

    const tower =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                5,
                9,
                145,
                20
            ),
            mat(
                0xe7edf0,
                .45,
                .15
            )
        );

    tower.position.y =
        72.5;

    tower.castShadow=true;

    g.add(tower);


    /* hub */

    const hub =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                11,
                18,
                14
            ),
            mat(
                0xf4f6f7,
                .35,
                .15
            )
        );

    hub.position.set(
        0,
        148,
        0
    );

    g.add(hub);


    /* blades */

    const blades =
        new THREE.Group();

    blades.position.set(
        0,
        148,
        0
    );


    for(
        let i=0;
        i<3;
        i++
    ){

        const blade =
            box(
                8,
                58,
                2.5,
                0xf8fafb,
                29
            );

        blade.position.y =
            29;

        blade.rotation.z =
            i*Math.PI*2/3;

        blades.add(blade);
    }


    g.add(blades);

    windFarm.add(g);

    return blades;
}


turbinePositions.forEach(
    p=>{
        turbine(
            p[0],
            p[1]
        );
    }
);

/* =========================================================
   CARS
========================================================= */

const cars=[];


function car(
    x,
    z,
    dir=0,
    color=0x1474b8
){

    const g =
        new THREE.Group();

    g.position.set(
        x,
        12,
        z
    );

    g.rotation.y =
        dir;


    const body =
        box(
            12,
            4,
            24,
            color,
            0
        );

    g.add(body);


    const roof =
        box(
            9,
            3,
            11,
            0xdbe8ef,
            4
        );

    g.add(roof);


    const wheelMat =
        mat(0x202326);


    for(
        const xx of [-6,6]
    ){

        for(
            const zz of [-7,7]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        2.1,
                        2.1,
                        2,
                        12
                    ),
                    wheelMat
                );

            wheel.rotation.z =
                Math.PI/2;

            wheel.position.set(
                xx,
                0,
                zz
            );

            g.add(wheel);
        }
    }


    city.add(g);


    cars.push({
        g,
        dir,
        base:
            45 + Math.random()*18
    });
}

/* =========================================================
   TRAFFIC SYSTEM
========================================================= */

let elapsed=0;

let state=0;

let stateStart=0;

const stateEl =
    document.getElementById(
        "trafficState"
    );


function setTraffic(){

    if(state===0){

        stateEl.textContent =
            "NORMAL";

        stateEl.style.background =
            "#159447";
    }


    if(state===1){

        stateEl.textContent =
            "TRAFFIC JAM";

        stateEl.style.background =
            "#b63a24";
    }


    if(state===2){

        stateEl.textContent =
            "AI RESOLVING";

        stateEl.style.background =
            "#c58b14";
    }


    if(state===3){

        stateEl.textContent =
            "CLEAR";

        stateEl.style.background =
            "#176eaa";
    }
}


setTraffic();


/* =========================================================
   CLICK INTERACTION
========================================================= */

const ray =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        mouse.x =
            e.clientX / innerWidth * 2 - 1;

        mouse.y =
            -(e.clientY / innerHeight) * 2 + 1;


        ray.setFromCamera(
            mouse,
            camera
        );


        const hits =
            ray.intersectObjects(
                scene.children,
                true
            );


        if(!hits.length)
            return;


        let o =
            hits[0].object;

        let found=null;


        while(o){

            found =
                clickable.find(
                    v=>v.object===o
                );

            if(found)
                break;

            o=o.parent;
        }


        if(found){

            document
                .getElementById(
                    "infoTitle"
                )
                .textContent =
                    found.title;


            document
                .getElementById(
                    "infoText"
                )
                .textContent =
                    found.text;


            document
                .getElementById(
                    "info"
                )
                .style.display =
                    "block";
        }
    }
);


/* =========================================================
   CLOCK
========================================================= */

const clock =
    new THREE.Clock();


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        clock.getDelta();


    elapsed += dt;


    /* --------------------------------
       TRAFFIC STATES
    -------------------------------- */

    if(
        state===0 &&
        elapsed>=60
    ){

        state=1;

        stateStart=
            elapsed;

        setTraffic();
    }


    if(
        state===1 &&
        elapsed-stateStart>=25
    ){

        state=2;

        stateStart=
            elapsed;

        setTraffic();
    }


    if(
        state===2 &&
        elapsed-stateStart>=30
    ){

        state=3;

        stateStart=
            elapsed;

        setTraffic();
    }


    if(
        state===3 &&
        elapsed-stateStart>=18
    ){

        state=0;

        stateStart=
            elapsed;

        elapsed=0;

        setTraffic();
    }


    /* --------------------------------
       CAR SPEED
    -------------------------------- */

    let speed;


    if(state===1){

        speed=0;

    }else if(state===2){

        speed=20;

    }else if(state===3){

        speed=42;

    }else{

        speed=52;
    }


    cars.forEach(
        c=>{

            if(state===1)
                return;


            c.g.position.x +=
                Math.cos(c.dir) *
                speed *
                dt;


            c.g.position.z +=
                Math.sin(c.dir) *
                speed *
                dt;


            if(
                c.g.position.x >
                800
            )
                c.g.position.x=-800;


            if(
                c.g.position.x <
                -800
            )
                c.g.position.x=800;


            if(
                c.g.position.z >
                580
            )
                c.g.position.z=-580;


            if(
                c.g.position.z <
                -580
            )
                c.g.position.z=580;
        }
    );


    /* --------------------------------
       TURBINE ANIMATION
    -------------------------------- */

    windFarm.children.forEach(
        g=>{

            if(
                g.children[2]
            ){

                g.children[2]
                    .rotation.z +=
                    dt*1.7;
            }
        }
    );


    /* --------------------------------
       TRAFFIC LIGHT ANIMATION
    -------------------------------- */

    const cycle =
        elapsed % 8;


    trafficLights.forEach(
        t=>{

            if(
                state===2
            ){

                t.lights[0]
                    .material.emissive
                    .setHex(
                        cycle < 2
                        ? 0xff2222
                        : 0x000000
                    );

                t.lights[1]
                    .material.emissive
                    .setHex(
                        cycle >=2 &&
                        cycle <4
                        ? 0xffaa00
                        : 0x000000
                    );

                t.lights[2]
                    .material.emissive
                    .setHex(
                        cycle >=4
                        ? 0x22dd55
                        : 0x000000
                    );

            }else{

                t.lights[1]
                    .material.emissive
                    .setHex(
                        0xffaa00
                    );
            }
        }
    );


    controls.update();

    renderer.render(
        scene,
        camera
    );
}


animate();
