/* =====================================================
   ROAD FUNCTION
===================================================== */

function createRoad(

    x,
    z,
    width,
    depth

){

    const road =
    new THREE.Mesh(

        new THREE.BoxGeometry(

            width,
            0.4,
            depth

        ),

        roadMaterial

    );


    road.position.set(

        x,
        1.2,
        z

    );


    road.receiveShadow =
    true;


    scene.add(
        road
    );


    /* Horizontal road markings */

    if(width > depth){

        for(

            let i=-width/2+10;

            i<width/2;

            i+=16

        ){

            const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    8,
                    0.07,
                    0.35

                ),

                roadLineMaterial

            );


            line.position.set(

                x+i,
                1.45,
                z

            );


            scene.add(
                line
            );

        }

    }

    /* Vertical road markings */

    else{

        for(

            let i=-depth/2+10;

            i<depth/2;

            i+=16

        ){

            const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.35,
                    0.07,
                    8

                ),

                roadLineMaterial

            );


            line.position.set(

                x,
                1.45,
                z+i

            );


            scene.add(
                line
            );

        }

    }

}

/* =====================================================

function createBoard(

    text,
    x,
    y,
    z,
    width=30

){

    const group =
    new THREE.Group();


    group.position.set(

        x,
        y,
        z

    );


    /* ---------------------------------------------
       MAIN POLE
    --------------------------------------------- */

    const pole =
    new THREE.Mesh(

        new THREE.CylinderGeometry(

            0.35,
            0.45,
            9,
            12

        ),

        material(

            0x30383d,
            0.6,
            0.2

        )

    );


    pole.position.y =
    4.5;


    pole.castShadow =
    true;


    group.add(
        pole
    );


    /* ---------------------------------------------
       POINTED TOP
    --------------------------------------------- */

    const spike =
    new THREE.Mesh(

        new THREE.ConeGeometry(

            0.65,
            2.5,
            8

        ),

        material(

            0x404a50,
            0.55,
            0.25

        )

    );


    spike.position.y =
    10.25;


    spike.castShadow =
    true;


    group.add(
        spike
    );


    /* ---------------------------------------------
       BOARD BODY
    --------------------------------------------- */

    const board =
    new THREE.Mesh(

        new THREE.BoxGeometry(

            width,
            5.8,
            0.55

        ),

        blueMaterial

    );


    board.position.y =
    7.4;


    board.castShadow =
    true;


    group.add(
        board
    );


    /* ---------------------------------------------
       TEXT CANVAS
    --------------------------------------------- */

    const canvas =
    document.createElement(
        "canvas"
    );


    canvas.width =
    1600;


    canvas.height =
    400;


    const ctx =
    canvas.getContext(
        "2d"
    );


    ctx.fillStyle =
    "#0b6085";


    ctx.fillRect(

        0,
        0,
        1600,
        400

    );


    ctx.strokeStyle =
    "#63ddff";


    ctx.lineWidth =
    12;


    ctx.strokeRect(

        10,
        10,
        1580,
        380

    );


    ctx.fillStyle =
    "#ffffff";


    ctx.font =
    "bold 105px Arial";


    ctx.textAlign =
    "center";


    ctx.textBaseline =
    "middle";


    ctx.fillText(

        text,

        800,
        200

    );


    const texture =
    new THREE.CanvasTexture(
        canvas
    );


    texture.colorSpace =
    THREE.SRGBColorSpace;


    /* ---------------------------------------------
       TEXT SURFACE
    --------------------------------------------- */

    const sign =
    new THREE.Mesh(

        new THREE.PlaneGeometry(

            width-1,
            5.1

        ),

        new THREE.MeshBasicMaterial({

            map:texture,

            side:THREE.DoubleSide

        })

    );


    sign.position.set(

        0,
        7.4,
        0.31

    );


    group.add(
        sign
    );


    /*
       IMPORTANT:
       This entire board is fixed.
       Nothing in animate() moves it.
    */

    group.userData.fixedBoard =
    true;


    scene.add(
        group
    );


    return group;

}

/* =====================================================
   WIND TURBINES
===================================================== */

const turbines=[];


function createTurbine(

    x,
    z,
    scale=1

){

    const group =
    new THREE.Group();


    group.position.set(

        x,
        0,
        z

    );


    group.scale.setScalar(
        scale
    );


    /* Tower */

    const tower =
    new THREE.Mesh(

        new THREE.CylinderGeometry(

            0.7,
            1.1,
            30,
            12

        ),

        whiteMaterial

    );


    tower.position.y =
    15;


    tower.castShadow =
    true;


    group.add(
        tower
    );


    /* Hub */

    const hub =
    new THREE.Group();


    hub.position.set(

        0,
        30,
        0

    );


    const center =
    new THREE.Mesh(

        new THREE.SphereGeometry(

            1.8,
            16,
            16

        ),

        whiteMaterial

    );


    hub.add(
        center
    );


    /* Three blades */

    for(

        let i=0;

        i<3;

        i++

    ){

        const blade =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                0.8,
                11,
                0.35

            ),

            whiteMaterial

        );


        blade.position.y =
        6;


        blade.rotation.z =
        i*Math.PI*2/3;


        blade.geometry.translate(

            0,
            5,
            0

        );


        hub.add(
            blade
        );

    }


    group.add(
        hub
    );


    scene.add(
        group
    );


    turbines.push(
        hub
    );

}

            0.2

        )

    );


    body.position.y =
    2.3;


    car.add(
        body
    );


    /* Cabin */

    const cabin =
    new THREE.Mesh(

        new THREE.BoxGeometry(

            3.7,
            1.4,
            2.5

        ),

        new THREE.MeshStandardMaterial({

            color:0x6edfff,

            transparent:true,

            opacity:0.45,

            roughness:0.1,

            metalness:0.3

        })

    );


    cabin.position.set(

        0.5,
        3.6,
        0

    );


    car.add(
        cabin
    );


    /* Wheels */

    const wheelMaterial =
    material(
        0x121518
    );


    for(

        const xx of [
            -2.3,
            2.3
        ]

    ){

        for(

            const zz of [
                -1.6,
                1.6
            ]

        ){

            const wheel =
            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    0.65,
                    0.65,
                    0.5,
                    16

                ),

                wheelMaterial

            );


            wheel.rotation.z =
            Math.PI/2;


            wheel.position.set(

                xx,
                1.2,
                zz

            );


            car.add(
                wheel
            );

        }

    }


    car.position.set(

        lane,
        1,
        z

    );


    scene.add(
        car
    );


    cars.push({

        car,

        speed,

        direction

    });

}

/* =====================================================
   MODEL PREPARATION
===================================================== */

function prepareModel(

    object,

    targetSize

){

    const box =
    new THREE.Box3()
    .setFromObject(
        object
    );


    const size =
    new THREE.Vector3();


    box.getSize(
        size
    );


    const maxDimension =
    Math.max(

        size.x,
        size.y,
        size.z

    );


    object.scale.setScalar(

        targetSize /
        Math.max(
            maxDimension,
            0.001
        )

    );


    const newBox =
    new THREE.Box3()
    .setFromObject(
        object
    );


    const center =
    new THREE.Vector3();


    newBox.getCenter(
        center
    );


    object.position.x -=
    center.x;


    object.position.z -=
    center.z;


    object.position.y -=
    newBox.min.y;


    object.traverse(

        child=>{

            if(
                child.isMesh
            ){

                child.castShadow =
                true;


                child.receiveShadow =
                true;

            }

        }

    );

}

/* =====================================================
   CLICK DETECTION
===================================================== */

const raycaster =
new THREE.Raycaster();


const mouse =
new THREE.Vector2();


renderer.domElement.addEventListener(

    "click",

    event=>{

        mouse.x =
        (event.clientX /
        window.innerWidth)*2-1;


        mouse.y =
        -(event.clientY /
        window.innerHeight)*2+1;


        raycaster.setFromCamera(

            mouse,
            camera

        );


        for(

            const item of clickable

        ){

            const hit =
            raycaster.intersectObject(

                item.object,
                true

            );


            if(
                hit.length
            ){

                if(
                    item.type ===
                    "school"
                ){

                    showPanel(

                        "BSS Smart School",

                        "Education Zone",

                        "A future-ready Beaconhouse educational facility designed for smart learning, digital education, accessibility and student innovation."

                    );

                }


                if(
                    item.type ===
                    "hospital"
                ){

                    showPanel(

                        "BSS Smart Hospital",

                        "Healthcare Zone",

                        "A modern smart healthcare facility connected to the city's transportation, emergency response and digital infrastructure."

                    );

                }


                return;

            }

        }

    }

);


/* =====================================================
   ANIMATION
===================================================== */

const clock =
new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
    clock.getElapsedTime();


    /* ---------------------------------------------
       WIND TURBINES
    --------------------------------------------- */

    turbines.forEach(

        turbine=>{

            turbine.rotation.z =
            time * 2.4;

        }

    );


    /* ---------------------------------------------
       TRAFFIC
    --------------------------------------------- */

    cars.forEach(

        carData=>{

            carData.car.position.x +=

                carData.speed *
                carData.direction;


            if(

                carData.car.position.x >
                220

            ){

                carData.car.position.x =
                -220;

            }


            if(

                carData.car.position.x <
                -220

            ){

                carData.car.position.x =
                220;

            }

        }

    );


    /* ---------------------------------------------
       AI TRAFFIC CONTROLLER SIGNAL
    --------------------------------------------- */

    signal.scale.setScalar(

        1 +
        Math.sin(time*4)*0.08

    );


    /* ---------------------------------------------
       TRAFFIC LIGHT CYCLE
    --------------------------------------------- */

    trafficLights.forEach(

        lightData=>{

            const cycle =

                (
                    time +
                    lightData.phase
                ) % 12;


            lightData.red.material
                .emissiveIntensity = 0;


            lightData.yellow.material
                .emissiveIntensity = 0;


            lightData.green.material
                .emissiveIntensity = 0;


            if(
                cycle < 5
            ){

                lightData.red.material
                    .emissiveIntensity = 3;

            }

            else if(
                cycle < 7
            ){

                lightData.yellow.material
                    .emissiveIntensity = 3;

            }

            else{

                lightData.green.material
                    .emissiveIntensity = 3;

            }

        }

    );


    /* ---------------------------------------------
       CAMERA
    --------------------------------------------- */

    controls.update();


    /* ---------------------------------------------
       RENDER
    --------------------------------------------- */

    renderer.render(

        scene,
        camera

    );

}


/* =====================================================
   START
===================================================== */

animate();
