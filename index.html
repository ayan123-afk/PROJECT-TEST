<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BSS WORLD — 3D Smart City</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#87b9d9;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

/* =========================
   TOP HEADER
========================= */

#ui{
    position:fixed;
    top:18px;
    left:18px;
    z-index:20;

    padding:16px 21px;

    border:1px solid rgba(70,210,255,.35);
    border-radius:15px;

    background:rgba(3,12,20,.90);

    backdrop-filter:blur(14px);

    box-shadow:
        0 12px 45px rgba(0,0,0,.35);
}

#ui .title{
    font-size:23px;
    font-weight:bold;
    letter-spacing:4px;
}

#ui .sub{
    margin-top:6px;
    color:#6edfff;
    font-size:11px;
    letter-spacing:1.2px;
}

/* =========================
   TRAFFIC STATUS
========================= */

#trafficStatus{
    position:fixed;
    top:18px;
    right:18px;
    z-index:25;

    width:290px;

    padding:16px 18px;

    border-radius:15px;

    background:rgba(3,12,20,.92);

    border:1px solid rgba(70,210,255,.30);

    box-shadow:
        0 12px 45px rgba(0,0,0,.35);
}

#trafficStatus .heading{
    color:#6edfff;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:8px;
}

#trafficState{
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

#trafficInfo{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.infoBox{
    padding:9px;

    border-radius:9px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.08);
}

.infoBox span{
    display:block;
    color:#8497a0;
    font-size:9px;
    letter-spacing:1px;
    margin-bottom:3px;
}

.infoBox strong{
    font-size:13px;
}

/* =========================
   MAIN PANEL
========================= */

#panel{
    position:fixed;

    right:18px;
    top:175px;

    width:350px;

    display:none;

    z-index:30;

    padding:22px;

    border-radius:17px;

    background:rgba(4,14,23,.96);

    border:1px solid rgba(70,215,255,.3);

    box-shadow:
        0 20px 70px rgba(0,0,0,.55);
}

#panel h2{
    color:#63ddff;
    margin-bottom:8px;
}

#panel .type{
    color:#78909c;
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:15px;
}

#panel p{
    color:#c5d1d7;
    line-height:1.6;
    font-size:13px;
}

.close{
    position:absolute;

    right:12px;
    top:12px;

    width:30px;
    height:30px;

    border:0;
    border-radius:8px;

    background:#18252d;

    color:white;

    font-size:18px;

    cursor:pointer;
}

/* =========================
   BOTTOM HINT
========================= */

#hint{
    position:fixed;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:20;

    padding:10px 18px;

    border-radius:12px;

    background:rgba(4,15,23,.88);

    border:1px solid rgba(255,255,255,.12);

    color:#c5d5dc;

    font-size:12px;

    white-space:nowrap;
}

/* =========================
   AI MESSAGE
========================= */

#aiMessage{
    position:fixed;

    left:50%;
    top:82px;

    transform:translateX(-50%);

    z-index:22;

    padding:9px 18px;

    border-radius:10px;

    background:rgba(4,15,23,.92);

    border:1px solid rgba(99,221,255,.25);

    color:#bfeeff;

    font-size:11px;

    letter-spacing:.5px;

    opacity:0;

    transition:.4s;
}

#aiMessage.show{
    opacity:1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #ui{
        transform:scale(.85);
        transform-origin:top left;
    }

    #trafficStatus{
        transform:scale(.8);
        transform-origin:top right;
    }

    #panel{
        width:300px;
    }

    #hint{
        font-size:10px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div id="ui">

    <div class="title">
        BSS WORLD
    </div>

    <div class="sub">
        3D SMART CITY • BEACONHOUSE SCHOOL SYSTEM
    </div>

</div>


<!-- =========================
     TRAFFIC STATUS
========================= -->

<div id="trafficStatus">

    <div class="heading">
        AI TRAFFIC MANAGEMENT
    </div>

    <div id="trafficState">

    </div>

    <div id="trafficInfo">

        <div class="infoBox">

        </div>

        <div class="infoBox">
            <span>TRAFFIC</span>

</div>


<!-- =========================
     AI MESSAGE
========================= -->

<div id="aiMessage">
    AI Traffic Controller
</div>


<!-- =========================
     INFORMATION PANEL
========================= -->

<div id="panel">

    <button
        class="close"

        ×
    </button>

</div>


<!-- =========================
     HINT
========================= -->

<div id="hint">
    Drag = Rotate &nbsp; | &nbsp;
    Wheel = Zoom &nbsp; | &nbsp;
    Click School / Hospital / Society / Bank
</div>


<!-- =========================
     THREE.JS
========================= -->

<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

</script>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from
"three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87b9d9);

scene.fog =
    new THREE.Fog(
        0x87b9d9,
        450,
        1200
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1800
    );

camera.position.set(
    310,
    220,
    340
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:
            "high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = .06;

controls.minDistance = 60;

controls.maxDistance = 750;

controls.target.set(
    0,
    8,
    0
);


/* =========================================================
   DAYLIGHT
========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0xdff4ff,
        0x55704d,
        2.4
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        4.2
    );

sun.position.set(
    -180,
    320,
    140
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;

sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -450;

sun.shadow.camera.right = 450;

sun.shadow.camera.top = 450;

sun.shadow.camera.bottom = -450;

scene.add(sun);


/* =========================================================
   MATERIAL HELPER
========================================================= */

function material(
    color,
    roughness=.8,
    metalness=0
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });

}


/* =========================================================
   MATERIALS
========================================================= */

const groundMaterial =
    material(0x304f35);

const roadMaterial =
    material(
        0x20272c,
        .95
    );

const roadLineMaterial =
    material(0xe9eeee);

const concreteMaterial =
    material(0x68747a);

const whiteMaterial =
    material(0xe8eef1);

const blueMaterial =
    material(
        0x116a92,
        .4,
        .2
    );


/* =========================================================
   CITY GROUND
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            900,
            900
        ),
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   MAIN CITY PLATFORM
========================================================= */

const city =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            420,
            1,
            330
        ),
        groundMaterial
    );

city.position.set(
    0,
    .5,
    0
);

city.receiveShadow = true;

scene.add(city);


/* =========================================================
   ROAD SYSTEM
========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .4,
                depth
            ),
            roadMaterial
        );

    road.position.set(
        x,
        1.2,
        z
    );

    road.receiveShadow = true;

    scene.add(road);


    /*
       ROAD LINES
    */

    if(width > depth){

        for(
            let i = -width/2 + 10;
            i < width/2;
            i += 16
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        8,
                        .07,
                        .35
                    ),
                    roadLineMaterial
                );

            line.position.set(
                x + i,
                1.45,
                z
            );

            scene.add(line);
        }

    }
    else{

        for(
            let i = -depth/2 + 10;
            i < depth/2;
            i += 16
        ){

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .35,
                        .07,
                        8
                    ),
                    roadLineMaterial
                );

            line.position.set(
                x,
                1.45,
                z + i
            );

            scene.add(line);
        }

    }

}


/* =========================================================
   OUTER ROADS
========================================================= */

createRoad(

    450,
    22
);

createRoad(
    0,
    185,
    450,

createRoad(

createRoad(

createRoad(

    12

createRoad(

createRoad(

/* =========================================================
   SIDEWALKS
========================================================= */

function sidewalk(

    depth
){

sidewalk(

/* =========================================================
   CITY BOUNDARY
========================================================= */

function wall(
    x,
    z,
    width,
    depth
){

    const w =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                5,

            ),
            material(0x5d686e)
        );

    w.position.set(
        x,

    w.castShadow = true;

wall(
    -205,
    0,
    3,
    330
);

wall(
    205,
    0,

wall(
    0,
    -165,
    410,
    3
);

wall(
    0,
    165,
    410,
    3
);


/* =========================================================
   FIXED 3D BOARD
========================================================= */

function createBoard(
    text,
    x,
    y,
    z,
    width=30
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        y,
        z
    );


    /* POLE */

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35,
                .45,
                9,
                12
            ),
            material(
                0x30383d,
                .6,
                .2
            )
        );

    pole.position.y = 4.5;

    pole.castShadow = true;

    group.add(pole);


    /* POINTED TOP */

    const spike =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .65,
                2.5,
                8
            ),
            material(
                0x404a50,
                .55,
                .25
            )
        );

    spike.position.y = 10.25;

    group.add(spike);


    /* BOARD */

    const board =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                5.8,
                .55
            ),
            blueMaterial
        );

    board.position.y = 7.4;

    group.add(board);


    /* TEXTURE */

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 1600;

    canvas.height = 400;

    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#0b6085";

    ctx.fillRect(
        0,
        0,
        1600,
        400
    );


    ctx.strokeStyle =
        "#63ddff";

    ctx.lineWidth = 12;

    ctx.strokeRect(
        10,
        10,
        1580,
        380
    );


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 105px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        text,
        800,
        200
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;


    const sign =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width - 1,
                5.1
            ),
            new THREE.MeshBasicMaterial({
                map:texture,
                side:
                    THREE.DoubleSide
            })
        );

    sign.position.set(
        0,
        7.4,
        .31
    );

    group.add(sign);


    group.userData.fixedBoard =
        true;

    scene.add(group);

    return group;
}


/* =========================================================
   ZONE BOARDS
========================================================= */

createBoard(
    "EDUCATION & HEALTH",
    -65,
    0,
    -150,
    38

/* =========================================================
   STREET LIGHTS
========================================================= */

function createStreetLight(
    x,
    z
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .18,
                .25,
                9,
                8
            ),
            concreteMaterial
        );

    pole.position.y = 4.5;

    group.add(pole);


    const arm =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3,
                .18,
                .18
            ),
            concreteMaterial
        );

    arm.position.set(
        1.3,
        8.5,
        0
    );

    group.add(arm);


    const bulb =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .45,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xfff2b0,
                emissive:0xffd56a,
                emissiveIntensity:.5
            })
        );

    bulb.position.set(
        2.6,
        8.3,
        0
    );

    group.add(bulb);


    scene.add(group);
}


/* CITY STREET LIGHT GRID */

for(
    let x = -180;
    x <= 180;
    x += 30
){

    createStreetLight(
        x,
        -92
    );

    createStreetLight(
        x,
        92
    );
}


for(
    let z = -140;
    z <= 140;
    z += 30
){

    createStreetLight(
        -92,
        z
    );

    createStreetLight(
        92,
        z
    );
}


/* =========================================================
   TRAFFIC LIGHT SYSTEM
========================================================= */

const trafficLights = [];


function createTrafficLight(
    x,
    z,
    rotation = 0
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    group.rotation.y =
        rotation;


    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .18,
                .22,
                8,
                8
            ),
            concreteMaterial
        );

    pole.position.y = 4;

    group.add(pole);


    const box =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.5,
                4.5,
                1.2
            ),
            material(
                0x181d20,
                .5
            )
        );

    box.position.y = 7;

    group.add(box);


    const red =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .32,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xff2222,
                emissive:0xff0000,
                emissiveIntensity:0
            })
        );

    red.position.set(
        0,
        8.25,
        .65
    );

    group.add(red);


    const yellow =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .32,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xffcc22,
                emissive:0xffaa00,
                emissiveIntensity:0
            })
        );

    yellow.position.set(
        0,
        7,
        .65
    );

    group.add(yellow);


    const green =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .32,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x22ff66,
                emissive:0x00ff44,
                emissiveIntensity:1
            })
        );

    green.position.set(
        0,
        5.75,
        .65
    );

    group.add(green);


    scene.add(group);


    trafficLights.push({
        red,
        yellow,
        green,
        phase:
            Math.random() * 10,
        rotation
    });

}

/* =========================================================
   WIND TURBINES
========================================================= */

const turbines = [];


function createTurbine(
    x,
    z,
    scale=1
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    group.scale.setScalar(
        scale
    );


    const tower =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .7,
                1.1,
                30,
                12
            ),
            whiteMaterial
        );

    tower.position.y = 15;

    tower.castShadow = true;

    group.add(tower);


    const hub =
        new THREE.Group();

    hub.position.set(
        0,
        30,
        0
    );


    const center =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.8,
                16,
                16
            ),
            whiteMaterial
        );

    hub.add(center);


    for(
        let i = 0;

/*
   CAR CREATOR
*/

function createCar(
    lane,
    z,
    speed,
    direction = 1,
    laneName = "main"
){

    const car =
        new THREE.Group();


    /* BODY */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                7,
                1.8,
                3.2
            ),
            material(
                0x287ca3,
                .45,
                .2
            )
        );

    body.position.y = 2.3;

    car.add(body);


    /* CABIN */

    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.7,
                1.4,
                2.5
            ),
            new THREE.MeshStandardMaterial({
                color:0x6edfff,
                transparent:true,
                opacity:.45,
                roughness:.1,
                metalness:.3
            })
        );

    cabin.position.set(
        .5,
        3.6,
        0
    );

    car.add(cabin);


    /* WHEELS */

    const wheelMaterial =
        material(
            0x121518
        );


    for(
        const xx of [-2.3,2.3]
    ){

        for(
            const zz of [-1.6,1.6]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .65,
                        .65,
                        .5,
                        16
                    ),
                    wheelMaterial
                );

            wheel.rotation.z =
                Math.PI / 2;

            wheel.position.set(
                xx,
                1.2,
                zz
            );

            car.add(wheel);

        }

    }


    car.position.set(
        lane,
        1,
        z
    );


    scene.add(car);


    cars.push({

        car,

        speed,

        baseSpeed:speed,

        direction,

        lane,

        z,

        laneName,

        jamStopped:false,

        originalZ:z

    });

}

/* =========================================================
   MODEL PREPARATION
========================================================= */

function prepareModel(
    object,
    targetSize
){

    const box =
        new THREE.Box3()
            .setFromObject(object);


    const size =
        new THREE.Vector3();

    box.getSize(size);


    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    object.scale.setScalar(
        targetSize /
        Math.max(
            maxDimension,
            .001
        )
    );


    const newBox =
        new THREE.Box3()
            .setFromObject(object);


    const center =
        new THREE.Vector3();

    newBox.getCenter(
        center
    );


    object.position.x -=
        center.x;

    object.position.z -=
        center.z;

    object.position.y -=
        newBox.min.y;


    object.traverse(
        child => {

            if(child.isMesh){

                child.castShadow = true;

                child.receiveShadow = true;

            }

        }
    );

}

/* =========================================================
   TRAFFIC SIMULATION
========================================================= */

const clock =
    new THREE.Clock();


let simulationSeconds = 0;


/*
   STATES:

   0 - NORMAL
   1 - JAM
   2 - AI RESOLVING
   3 - CLEAR
*/

let trafficState =
    0;


/*
   JAM START:
   180 seconds = 3 minutes
*/

const JAM_TIME =
    180;


/*
   JAM DURATION
*/

const JAM_DURATION =
    25;


/*
   AI RESOLUTION
*/

const RESOLVE_DURATION =
    30;


/*
   AI state start
*/

let jamStartTime = 0;

let resolveStartTime = 0;


/* =========================================================
   UI REFERENCES
========================================================= */

const simulationTime =
    document.getElementById(
        "simulationTime"
    );

const trafficLevel =
    document.getElementById(
        "trafficLevel"
    );

const trafficFlow =
    document.getElementById(
        "trafficFlow"
    );

const aiMode =
    document.getElementById(
        "aiMode"
    );

const trafficStateElement =
    document.getElementById(
        "trafficState"
    );

const aiMessage =
    document.getElementById(
        "aiMessage"

/* =========================================================
   AI MESSAGE
========================================================= */

function showAIMessage(
    message
){

    aiMessage.textContent =
        message;

    aiMessage.classList.add(
        "show"
    );


    setTimeout(
        () => {

            aiMessage.classList.remove(
                "show"
            );

        },
        4500
    );

}


/* =========================================================
   TRAFFIC STATUS
========================================================= */

function setTrafficStatus(
    state
){

    if(
        state === 0
    ){

        trafficStateElement.textContent =
            "TRAFFIC NORMAL";

        trafficStateElement.style.color =
            "#63ddff";

        trafficLevel.textContent =
            "NORMAL";

        trafficFlow.textContent =
            "92%";

        aiMode.textContent =
            "MONITORING";

    }


    if(
        state === 1
    ){

        trafficStateElement.textContent =
            "TRAFFIC JAM";

        trafficStateElement.style.color =
            "#ffcc55";

        trafficLevel.textContent =
            "JAM";

        trafficFlow.textContent =
            "18%";

        aiMode.textContent =
            "DETECTING";

    }


    if(
        state === 2
    ){

        trafficStateElement.textContent =
            "AI RESOLVING";

        trafficStateElement.style.color =
            "#66e5ff";

        trafficLevel.textContent =
            "HEAVY";

        trafficFlow.textContent =
            "54%";

        aiMode.textContent =
            "OPTIMIZING";

    }


    if(
        state === 3
    ){

        trafficStateElement.textContent =
            "TRAFFIC CLEAR";

        trafficStateElement.style.color =
            "#65ff9a";

        trafficLevel.textContent =
            "CLEAR";

        trafficFlow.textContent =
            "96%";

        aiMode.textContent =
            "OPTIMAL";

    }

}


/* =========================================================
   CREATE TRAFFIC JAM
========================================================= */

function activateTrafficJam(){

    trafficState =
        1;

    jamStartTime =
        simulationSeconds;


    /*
       Create visible queue.
       Cars are compressed toward
       the traffic controller.
    */

    let queueIndex = 0;


    for(
        const data of cars
    ){

        if(
            data.laneName ===
            "north-road"
        ){

            data.jamStopped =
                true;

            data.speed =
                0;


            data.car.position.x =
                -125 +
                queueIndex * 13;


            queueIndex++;

        }

    }


    setTrafficStatus(
        trafficState
    );


    showAIMessage(
        "⚠ AI TRAFFIC CONTROLLER: CONGESTION DETECTED"
    );

}


/* =========================================================
   AI RESOLUTION
========================================================= */

function activateAIResolution(){

    trafficState =
        2;

    resolveStartTime =
        simulationSeconds;


    /*
       AI increases traffic flow.
    */

    for(
        const data of cars
    ){

        data.jamStopped =
            false;

        data.speed =
            data.baseSpeed *
            .55;

    }


    setTrafficStatus(
        trafficState
    );


    showAIMessage(
        "AI is optimizing traffic signals and opening an alternate route."
    );

}


/* =========================================================
   CLEAR TRAFFIC
========================================================= */

function clearTraffic(){

    trafficState =
        3;


    for(
        const data of cars
    ){

        data.jamStopped =
            false;

        data.speed =
            data.baseSpeed;

    }


    setTrafficStatus(
        trafficState
    );


    showAIMessage(
        "✓ AI TRAFFIC CONTROLLER: TRAFFIC FLOW RESTORED"
    );

}


/* =========================================================
   UPDATE TRAFFIC CARS
========================================================= */

function updateCars(){

    for(
        const data of cars
    ){

        /*
           NORMAL
        */

        if(
            trafficState === 0
        ){

            data.speed =
                data.baseSpeed;

        }


        /*
           JAM
        */

        if(
            trafficState === 1
        ){

            /*
               Some cars remain stopped
               to show queue.
            */

            if(
                data.jamStopped
            ){

                data.speed = 0;

            }

            else{

                data.speed =
                    data.baseSpeed *
                    .25;

            }

        }


        /*
           AI RESOLVING
        */

        if(
            trafficState === 2
        ){

            /*
               Gradual acceleration.
            */

            const elapsed =
                simulationSeconds -
                resolveStartTime;


            const progress =
                Math.min(
                    elapsed /
                    RESOLVE_DURATION,
                    1
                );


            data.speed =
                data.baseSpeed *
                (
                    .35 +
                    progress * .65
                );

        }


        /*
           CLEAR
        */

        if(
            trafficState === 3
        ){

            data.speed =
                data.baseSpeed;

        }


        /*
           MOVE CAR
        */

        data.car.position.x +=
            data.speed *
            data.direction;


        /*
           LOOP AROUND CITY
        */

        if(
            data.car.position.x >
            220
        ){

            data.car.position.x =
                -220;

        }


        if(
            data.car.position.x <
            -220
        ){

            data.car.position.x =
                220;

        }

    }

}


/* =========================================================
   TRAFFIC SIGNAL UPDATE
========================================================= */

function updateTrafficLights(
    time
){

    trafficLights.forEach(
        lightData => {

            /*
               During AI resolving,
               optimize signal cycle.
            */

            let cycleLength =
                trafficState === 2
                    ? 8
                    : 12;


            const cycle =
                (
                    time +
                    lightData.phase
                ) %
                cycleLength;


            lightData.red
                .material
                .emissiveIntensity = 0;


            lightData.yellow
                .material
                .emissiveIntensity = 0;


            lightData.green
                .material
                .emissiveIntensity = 0;


            /*
               NORMAL
            */

            if(
                cycle < 5
            ){

                lightData.red
                    .material
                    .emissiveIntensity =
                        3;

            }

            else if(
                cycle < 7
            ){

                lightData.yellow
                    .material
                    .emissiveIntensity =
                        3;

            }

            else{

                lightData.green
                    .material
                    .emissiveIntensity =
                        3;

            }

        }
    );

}


/* =========================================================
   SIMULATION STATE MACHINE
========================================================= */

function updateTrafficSystem(){

    /*
       3 MINUTES
    */

    if(
        trafficState === 0 &&
        simulationSeconds >= JAM_TIME
    ){

        activateTrafficJam();

    }


    /*
       JAM FOR 25 SECONDS
    */

    if(
        trafficState === 1 &&
        simulationSeconds -
        jamStartTime >=
        JAM_DURATION
    ){

        activateAIResolution();

    }


    /*
       AI RESOLVES FOR 30 SECONDS
    */

    if(
        trafficState === 2 &&
        simulationSeconds -
        resolveStartTime >=
        RESOLVE_DURATION
    ){

        clearTraffic();

    }

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

    const totalSeconds =
        Math.floor(
            simulationSeconds
        );


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    simulationTime.textContent =

        String(minutes)
            .padStart(2,"0")

        +

        ":"

        +

        String(seconds)
            .padStart(2,"0");

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    const elapsed =
        clock.elapsedTime;


    /*
       Simulation timer
    */

    simulationSeconds +=
        delta;


    /*
       Timer
    */

    updateTimer();


    /*
       Traffic state machine
    */

    updateTrafficSystem();


    /*
       Cars
    */

    updateCars();


    /*
       Traffic lights
    */

    updateTrafficLights(
        elapsed
    );


    /*
       Wind turbines
    */

    turbines.forEach(
        turbine => {

            turbine.rotation.z =
                elapsed * 2.4;

        }
    );


    /*
       AI controller signal
    */

    signal.scale.setScalar(
        1 +
        Math.sin(
            elapsed * 4
        ) * .08
    );


    /*
       Controls
    */

    controls.update();


    /*
       Render
    */

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   START
========================================================= */

setTrafficStatus(
    0
);

animate();

   RESIZE
========================================================= */

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
