<!DOCTYPE html>

<head>

<title>BSS World — Smart City Campus</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#061018;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

#ui{
  position:fixed;
  top:18px;
  left:18px;
  z-index:10;
  padding:16px 20px;
  border:1px solid rgba(100,220,255,.25);
  border-radius:14px;
  background:rgba(4,15,23,.78);

#ui .sub{
  margin-top:5px;

#hint{

  bottom:18px;
  left:50%;

  border:1px solid rgba(255,255,255,.12);
  color:#b7cbd5;
  font-size:12px;
  white-space:nowrap;
}

#panel{
  position:fixed;
  right:20px;
  top:20px;
  width:350px;
  max-height:calc(100vh - 40px);
  overflow:auto;
  z-index:15;
  display:none;
  padding:22px;
  border-radius:18px;
  background:rgba(5,16,25,.94);

========================================================= */

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth/window.innerHeight,
  0.1,
  1200
);

  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* =========================================================
   CAMERA
========================================================= */

const controls=new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.06;

controls.minDistance=35;
controls.maxDistance=420;

   LIGHTING
========================================================= */

);

========================================================= */

function mat(
  color,
  roughness=.8,
  metalness=0
){
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });
}

const grassDark=mat(0x244a2c);
const roadMat=mat(0x202830,.95);

const wallMat=mat(0x6b777d);

  transparent:true,

   GROUND

/* =========================================================
   ROADS
========================================================= */

function createRoad(x,z,w,d){

  const road=new THREE.Mesh(
    new THREE.BoxGeometry(w,.35,d),
    roadMat
  );

  road.position.set(x,1,z);

  road.receiveShadow=true;

  scene.add(road);


  if(w>d){

    for(
      let i=-w/2+8;
      i<w/2;
      i+=12
    ){

      const mark=new THREE.Mesh(
        new THREE.BoxGeometry(6,.06,.35),
        whiteMat
      );

      mark.position.set(
        x+i,
        1.2,
        z
      );

      scene.add(mark);
    }

  }else{

    for(
      let i=-d/2+8;
      i<d/2;
      i+=12
    ){

      const mark=new THREE.Mesh(
        new THREE.BoxGeometry(.35,.06,6),
        whiteMat
      );

      mark.position.set(
        x,
        1.2,
        z+i
      );

      scene.add(mark);
    }
  }
}

/* =========================================================
   TEXT SPRITES
========================================================= */

function addTextSprite(text,pos){

  const canvas=document.createElement("canvas");

  canvas.width=1024;
  canvas.height=180;

  const ctx=canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    1024,
    180
  );

  ctx.fillStyle="#ffffff";

  ctx.font="bold 70px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    text,
    512,
    90
  );

  const texture=new THREE.CanvasTexture(canvas);

  const material=new THREE.SpriteMaterial({
    map:texture,
    transparent:true
  });

  const sprite=new THREE.Sprite(material);

  sprite.position.copy(pos);

  sprite.scale.set(
    32,
    5.6,
    1
  );

  scene.add(sprite);

  return sprite;
}

function createTree(x,z,scale=1){

  const group=new THREE.Group();

  group.position.set(
    x,

  group.scale.setScalar(scale);


  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(

    0,
    10,
    0
  );

  crown1.castShadow=true;

  group.add(crown1);


  const crown2=new THREE.Mesh(
    new THREE.SphereGeometry(
      3.8,
      14,
      12
    ),
    foliageMat
  );

  crown2.position.set(
    -3,
    9,
    1
  );

  crown2.castShadow=true;

  group.add(crown2);


  const crown3=new THREE.Mesh(
    new THREE.SphereGeometry(
      3.5,
      14,
      12
    ),
    foliageMat
  );

  crown3.position.set(
    3,
    9,
    -1
  );

  crown3.castShadow=true;

  group.add(crown3);


  scene.add(group);

  trees.push(group);

  return group;
}

/* =========================================================
   MAPLE TREE GLB
========================================================= */

const loader=new GLTFLoader();

const mapleTrees=[];

function loadMapleTree(x,z,scale=4){

  loader.load(

    "./maple_tree.glb",

    gltf=>{

      const tree=gltf.scene;

      tree.traverse(child=>{

        if(child.isMesh){

          child.castShadow=true;
          child.receiveShadow=true;

        }

      });


      tree.scale.setScalar(scale);

      tree.position.set(
        x,
        1,
        z
      );


      /* Store original rotation */

      tree.userData.baseRotationX=tree.rotation.x;
      tree.userData.baseRotationZ=tree.rotation.z;

      tree.userData.phase=
        Math.random()*Math.PI*2;


      scene.add(tree);

      mapleTrees.push(tree);

    },

    undefined,

    error=>{

      console.error(
        "Maple Tree GLB loading error:",
        error
      );

    }

  );
}

/* =========================================================
   STUDENTS
========================================================= */

const students=[];

function createStudent(x,z){

  const group=new THREE.Group();

  group.position.set(
    x,
    1.5,
    z
  );


  const uniform=mat(0x183f65);
  const skin=mat(0xd69b78);
  const dark=mat(0x20242a);


  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .8,
      1.8,
      4,
      8
    ),
    uniform
  );

  body.position.y=2.3;

  body.castShadow=true;

  group.add(body);


  const head=new THREE.Mesh(
    new THREE.SphereGeometry(
      .72,
      12,
      10
    ),
    skin
  );

  head.position.y=4.3;

  head.castShadow=true;

  group.add(head);


  const hair=new THREE.Mesh(
    new THREE.SphereGeometry(
      .75,
      12,
      8,
      0,
      Math.PI*2,
      0,
      Math.PI/2
    ),
    dark
  );

  hair.position.y=4.65;

  group.add(hair);


  const armL=new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .18,
      1.25,
      4,
      6
    ),
    uniform
  );

  armL.position.set(
    -1,
    2.5,
    0
  );

  group.add(armL);


  const armR=armL.clone();

  armR.position.x=1;

  group.add(armR);


  const legL=new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .22,
      1.35,
      4,
      6
    ),
    dark
  );

  legL.position.set(
    -.4,
    .9,
    0
  );

  group.add(legL);


  const legR=legL.clone();

  legR.position.x=.4;

  group.add(legR);


  scene.add(group);


  const student={
    group,
    armL,
    armR,
    legL,
    legR,

    baseX:x,
    baseZ:z,

    phase:
      Math.random()*Math.PI*2,

    radius:
      8+Math.random()*12,

    speed:
      .25+Math.random()*.2
  };


  students.push(student);

  return student;
}


for(

}

/* =========================================================
   MODEL PREPARATION
========================================================= */

function prepareModel(
  object,
  targetSize=65
){

  const box=new THREE.Box3()
    .setFromObject(object);

  const size=new THREE.Vector3();

  const center=new THREE.Vector3();

  box.getSize(size);

  box.getCenter(center);


  const maxDim=Math.max(
    size.x,
    size.y,
    size.z
  );

  const scale=
    targetSize/maxDim;

  object.scale.setScalar(scale);


  const newBox=new THREE.Box3()
    .setFromObject(object);

  const newCenter=new THREE.Vector3();

  newBox.getCenter(newCenter);


  object.position.x-=newCenter.x;
  object.position.z-=newCenter.z;
  object.position.y-=newBox.min.y;


  object.traverse(child=>{

    if(child.isMesh){

      child.castShadow=true;
      child.receiveShadow=true;

    }

  });
}

/* =========================================================
   RAYCASTING
========================================================= */

const raycaster=new THREE.Raycaster();

const mouse=new THREE.Vector2();

renderer.domElement.addEventListener(
  "click",
  event=>{

    mouse.x=
      (event.clientX/window.innerWidth)*2-1;

    mouse.y=
      -(event.clientY/window.innerHeight)*2+1;


    raycaster.setFromCamera(
      mouse,
      camera
    );


    for(const item of clickable){

      const hits=
        raycaster.intersectObject(
          item.object,
          true
        );


      if(hits.length){

        if(item.type==="school"){

          showSchool();

        }


        if(item.type==="hospital"){

          showHospital();

        }


        return;
      }
    }

  }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );


  const t=
    clock.getElapsedTime();


  /* =====================================================
     STUDENT WALKING
  ===================================================== */

  students.forEach(s=>{

    const angle=
      s.phase+t*s.speed;


    s.group.position.x=
      s.baseX+
      Math.cos(angle)*s.radius;


    s.group.position.z=
      s.baseZ+
      Math.sin(angle)*
      s.radius*.65;


    s.group.rotation.y=
      -Math.sin(angle);


    const walk=
      Math.sin(
        t*8+s.phase
      );


    s.legL.rotation.x=
      walk*.55;

    s.legR.rotation.x=
      -walk*.55;

    s.armL.rotation.x=
      -walk*.4;

    s.armR.rotation.x=
      walk*.4;


    s.group.position.y=
      1.5+
      Math.abs(
        Math.sin(
          t*8+s.phase
        )
      )*.12;

  });


  /* =====================================================
     CARS
  ===================================================== */

  cars.forEach(c=>{

    c.car.position.x+=c.speed;


    if(c.car.position.x>90){

      c.car.position.x=-90;

    }

  });


  /* =====================================================
     NORMAL TREE WIND
  ===================================================== */

  trees.forEach((tree,i)=>{

    tree.rotation.z=
      Math.sin(
        t*.8+i
      )*.015;


    tree.rotation.x=
      Math.cos(
        t*.7+i
      )*.01;

  });


  /* =====================================================
     MAPLE TREE WIND
     
     VERY SMALL MOVEMENT
     SO THEY DO NOT SPIN UNREALISTICALLY
  ===================================================== */

  mapleTrees.forEach(tree=>{

    const phase=
      tree.userData.phase || 0;


    tree.rotation.z=
      tree.userData.baseRotationZ+
      Math.sin(
        t*.9+phase
      )*.025;


    tree.rotation.x=
      tree.userData.baseRotationX+
      Math.cos(
        t*.75+phase
      )*.015;

  });


  /* =====================================================
     LIGHT ANIMATION
  ===================================================== */

  lamps.forEach((light,i)=>{

    light.intensity=
      Math.max(
        0,
        Math.sin(
          t*1.5+i*.4
        )
      )*.8;

  });


  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();
