========================================================= */

========================================================= */

  antialias:true,

  window.innerHeight
);

  Math.min(
    window.devicePixelRatio,

);

renderer.shadowMap.type =

  metalness = 0

    roughness,
    metalness

/* =========================================================
   ROADS
========================================================= */

function createRoad(
  x,
  z,
  w,
  d
){

  const road =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,
      .35,
      d
    ),
    roadMat
  );

  road.position.set(
    x,
    1,
    z
  );

  road.receiveShadow = true;

  scene.add(road);


  if(w > d){

    for(
      let i = -w/2 + 8;
      i < w/2;
      i += 14
    ){

      const mark =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          7,
          .06,
          .35
        ),
        whiteMat
      );

      mark.position.set(
        x+i,
        1.2,
        z
      );

      scene.add(mark);

    }

  }

  else{

    for(
      let i = -d/2 + 8;
      i < d/2;
      i += 14
    ){

      const mark =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .35,
          .06,
          7
        ),
        whiteMat
      );

      mark.position.set(
        x,
        1.2,
        z+i
      );

      scene.add(mark);

    }

  }

}

/* =========================================================
   TEXT SPRITES
========================================================= */

function addTextSprite(
  text,
  pos,
  sx=32,
  sy=5.6
){

  const canvas =
  document.createElement(
    "canvas"
  );

  canvas.width = 1024;

  canvas.height = 180;

  const ctx =
  canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    1024,
    180
  );

  ctx.fillStyle =
  "#ffffff";

  ctx.font =
  "bold 70px Arial";

  ctx.textAlign =
  "center";

  ctx.textBaseline =
  "middle";

  ctx.fillText(
    text,
    512,
    90
  );


  const texture =
  new THREE.CanvasTexture(
    canvas
  );

  texture.colorSpace =
  THREE.SRGBColorSpace;


  const sprite =
  new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:texture,
      transparent:true,
      depthTest:false
    })
  );

  sprite.position.copy(pos);

  sprite.scale.set(
    sx,
    sy,
    1
  );

  scene.add(sprite);

  return sprite;
}


/* =========================================================
   3D BOARDS
========================================================= */

function createBoard(
  title,
  x,
  z,
  width=22,
  color=0x126a94
){

  const group =
  new THREE.Group();

  group.position.set(
    x,
    0,
    z
  );


  const postMat =
  mat(0x3d474c);


  for(
    const px of [
      -width/2+1,
      width/2-1
    ]
  ){

    const post =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .22,
        .28,
        5,
        8
      ),
      postMat
    );

    post.position.set(
      px,
      2.5,
      0
    );

    group.add(post);

  }


  const board =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      4.5,
      .45
    ),
    mat(
      color,
      .5,
      .15
    )
  );

  board.position.y = 5;

  board.castShadow = true;

  group.add(board);


  const top =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      width+.5,
      .35,
      .7
    ),
    whiteMat
  );

  top.position.y = 7.35;

  group.add(top);


  scene.add(group);


  addTextSprite(
    title,
    new THREE.Vector3(
      x,
      5,
      z-.5
    ),
    width*1.25,
    4.5
  );

}

/* =========================================================
   FLOWERS
========================================================= */

const flowers=[];


function createFlower(
  x,
  z,
  scale=.7
){

  const group =
  new THREE.Group();

  group.position.set(
    x,
    1.3,
    z
  );

  group.scale.setScalar(
    scale
  );


  const stem =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .06,
      .08,
      1.4,
      6
    ),
    mat(0x2c7a39)
  );

  stem.position.y=.7;

  group.add(stem);


  const colors=[
    0xff5f7e,
    0xffd84d,
    0xff8cff,
    0xffffff
  ];

  const flowerMat =
  mat(
    colors[
      Math.floor(
        Math.random()*
        colors.length
      )
    ]
  );


  for(
    let i=0;
    i<5;
    i++
  ){

    const petal =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .28,
        8,
        8
      ),
      flowerMat
    );

    const angle =
    i/5*Math.PI*2;

    petal.position.set(
      Math.cos(angle)*.38,
      1.45,
      Math.sin(angle)*.38
    );

    petal.scale.y=.55;

    group.add(petal);

  }


  const center =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .2,
      8,
      8
    ),
    mat(0xffd84d)
  );

  center.position.y=1.45;

  group.add(center);

  scene.add(group);

  flowers.push(group);

}

/* =========================================================
   STUDENTS
========================================================= */

const students=[];


function createStudent(
  x,
  z
){

  const group =
  new THREE.Group();

  group.position.set(
    x,
    1.5,
    z
  );


  const uniform =
  mat(0x183f65);

  const skin =
  mat(0xd69b78);

  const dark =
  mat(0x20242a);


  const body =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .8,
      1.8,
      4,
      8
    ),
    uniform
  );

  body.position.y=2.3;

  group.add(body);


  const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .72,
      12,
      10
    ),
    skin
  );

  head.position.y=4.3;

  group.add(head);


  const hair =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .75,
      12,
      8,
      0,
      Math.PI*2,
      0,
      Math.PI/2
    ),
    dark
  );

  hair.position.y=4.65;

  group.add(hair);


  const armL =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .18,
      1.25,
      4,
      6
    ),
    uniform
  );

  armL.position.set(
    -1,
    2.5,
    0
  );

  group.add(armL);


  const armR =
  armL.clone();

  armR.position.x=1;

  group.add(armR);


  const legL =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .22,
      1.35,
      4,
      6
    ),
    dark
  );

  legL.position.set(
    -.4,
    .9,
    0
  );

  group.add(legL);


  const legR =
  legL.clone();

  legR.position.x=.4;

  group.add(legR);


  scene.add(group);


  students.push({

    group,
    armL,
    armR,
    legL,
    legR,

    baseX:x,
    baseZ:z,

    phase:
      Math.random()*
      Math.PI*2,

    radius:
      10+
      Math.random()*15,

    speed:
      .18+
      Math.random()*.15

  });

}


for(
  let i=0;
  i<18;
  i++
){

  const angle =
    i/18*Math.PI*2;

  createStudent(
    -42+
    Math.cos(angle)*35,

    Math.sin(angle)*28
  );

}

const cars=[];

mat(0x15191d);


function createCar(z){

  const car =
  new THREE.Group();


  const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      7,
      1.7,
      3.2
    ),
    mat(
      0x287aa3,
      .45,
      .2
    )
  );

  body.position.y=2.3;

  car.add(body);


  const cabin =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      3.6,
      1.3,
      2.6
    ),
    glassMat
  );

  cabin.position.set(
    .5,
    3.5,
    0
  );

  car.add(cabin);


  for(
    const x of [-2.3,2.3]
  ){

    for(
      const zz of [-1.55,1.55]
    ){

      const wheel =
      new THREE.Mesh(
        new THREE.CylinderGeometry(

          .65,
          .45,

      wheel.rotation.z =
      Math.PI/2;

      wheel.position.set(
        x,

      car.add(wheel);

  car.position.set(
    -150,
    1,
    z
  );

  scene.add(car);


  cars.push({

    car,

    speed:
      .3+
      Math.random()*.15

/* =========================================================
   MODEL PREPARATION
========================================================= */

function prepareModel(
  object,
  targetSize
){

  const box =
  new THREE.Box3()
  .setFromObject(object);

  const size =
  new THREE.Vector3();

  const center =
  new THREE.Vector3();

  box.getSize(size);

  box.getCenter(center);


  const maxDim =
  Math.max(
    size.x,
    size.y,
    size.z
  );


  object.scale.setScalar(
    targetSize/
    Math.max(
      maxDim,
      .001
    )
  );


  const b2 =
  new THREE.Box3()
  .setFromObject(object);

  const c2 =
  new THREE.Vector3();

  b2.getCenter(c2);


  object.position.x -=
  c2.x;

  object.position.z -=
  c2.z;

  object.position.y -=
  b2.min.y;


  object.traverse(
    child=>{

      if(child.isMesh){

        child.castShadow=true;

        child.receiveShadow=true;

      }

    }
  );

}

/* =========================================================
   HOTELS DISTRICT
========================================================= */

function loadHotels(){

  loader.load(

    "./hotels.glb",

    gltf=>{

      const template =
      gltf.scene;


      prepareModel(
        template,
        38
      );


      /*
        HOTELS ARE PLACED
        ON THE EAST SIDE
        OF THE MAIN CITY.
      */

      const positions=[

        [105,-72],
        [105,20],
        [105,70]

      ];


      positions.forEach(
        (position,index)=>{

          const hotel =
          template.clone(true);


          hotel.position.set(
            position[0],
            1,
            position[1]
          );


          hotel.rotation.y =
          index*.3;


          scene.add(
            hotel
          );


          hotel.traverse(
            child=>{

              if(child.isMesh){

                child.castShadow=true;

                child.receiveShadow=true;

              }

            }
          );


          const names=[

            "BSS CITY HOTEL",

            "BSS GRAND HOTEL",

            "BSS SMART HOTEL"

          ];


          createBoard(
            names[index],
            position[0],
            position[1]+25,
            24,
            0x7252a8
          );

        }
      );

    },

    undefined,

    error=>{

      console.error(
        "Hotels GLB error:",
        error
      );

    }

  );

}

loadHotels();


/* =========================================================
   BUILDINGS DISTRICT
========================================================= */

function loadBuildings(){

  loader.load(

    "./buildings.glb",

    gltf=>{

      const template =
      gltf.scene;


      prepareModel(
        template,
        34
      );


      /*
        BUILDINGS ARE ALSO
        KEPT ON THE EAST SIDE.
        THEY DO NOT MIX WITH
        THE SCHOOL/HOSPITAL.
      */

      const positions=[

        [100,-100],
        [130,-55],
        [105,-5],
        [130,45],
        [100,95],

        [70,-100],
        [70,100]

      ];


      positions.forEach(
        (position,index)=>{

          const building =
          template.clone(true);


          const sizeFactor =
          .85+
          (index%3)*.15;


          building.scale.multiplyScalar(
            sizeFactor
          );


          building.position.set(
            position[0],
            1,
            position[1]
          );


          building.rotation.y =
          (index%4)*.35;


          scene.add(
            building
          );


          building.traverse(
            child=>{

              if(child.isMesh){

                child.castShadow=true;

                child.receiveShadow=true;

              }

            }
          );

        }
      );


      createBoard(
        "SMART CITY BUILDINGS",
        105,
        -113,
        28,
        0x315c87
      );

    },

    undefined,

    error=>{

      console.error(
        "Buildings GLB error:",
        error
      );

    }

  );

}

loadBuildings();

/* =========================================================
   RAYCASTING
========================================================= */

const raycaster =
new THREE.Raycaster();

const mouse =
new THREE.Vector2();


renderer.domElement.addEventListener(
  "click",
  event=>{

    mouse.x =
      (event.clientX/
      window.innerWidth)*2-1;


    mouse.y =
      -(event.clientY/
      window.innerHeight)*2+1;


    raycaster.setFromCamera(
      mouse,
      camera
    );


    for(
      const item of clickable
    ){

      const hits =
      raycaster.intersectObject(
        item.object,
        true
      );


      if(hits.length){

        if(
          item.type ===
          "school"
        ){

          showSchool();

        }


        if(
          item.type ===
          "hospital"
        ){

          showHospital();

        }


        return;

      }

    }

  }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const t =
  clock.getElapsedTime();


  /* STUDENTS */

  students.forEach(
    s=>{

      const angle =
      s.phase+
      t*s.speed;


      s.group.position.x =
      s.baseX+
      Math.cos(angle)*
      s.radius;


      s.group.position.z =
      s.baseZ+
      Math.sin(angle)*
      s.radius*.65;


      s.group.rotation.y =
      -Math.sin(angle);


      const walk =
      Math.sin(
        t*8+
        s.phase
      );


      s.legL.rotation.x =
      walk*.55;

      s.legR.rotation.x =
      -walk*.55;

      s.armL.rotation.x =
      -walk*.4;

      s.armR.rotation.x =
      walk*.4;


      s.group.position.y =
      1.5+
      Math.abs(
        Math.sin(
          t*8+
          s.phase
        )
      )*.12;

    }
  );


  /* CARS */

  cars.forEach(
    c=>{

      c.car.position.x +=
      c.speed;


      if(
        c.car.position.x >
        160
      ){

        c.car.position.x =
        -160;

      }

    }
  );


  /* TREE WIND */

  trees.forEach(
    (tree,index)=>{

      tree.rotation.z =
      Math.sin(
        t*.7+index
      )*.018;


      tree.rotation.x =
      Math.cos(
        t*.6+index
      )*.012;

    }
  );


  /* FLOWERS */

  flowers.forEach(
    (flower,index)=>{

      flower.rotation.z =
      Math.sin(
        t*1.2+index
      )*.025;

    }
  );


  /* LIGHTS */

  lamps.forEach(
    (light,index)=>{

      light.intensity =
      Math.max(
        0,
        Math.sin(
          t*1.5+
          index*.4
        )
      )*.8;

    }
  );


  controls.update();

  renderer.render(
    scene,
    camera
  );

}


animate();

window.addEventListener(

      window.innerWidth/
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);
